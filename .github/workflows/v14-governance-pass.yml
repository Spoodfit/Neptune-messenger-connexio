name: V14 governance pass

on:
  pull_request:
    branches:
      - feat/production-hardening
    paths:
      - .github/workflows/v14-governance-pass.yml
      - scripts/.tmp_core.*.b64
      - scripts/.tmp_providers.*.b64
      - scripts/.tmp_automation.*.b64
      - scripts/.tmp_ringtone.*.b64
      - scripts/.tmp_notification.b64

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v14-ux-calls-moderation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore patch scripts and sounds
        run: |
          cat <<'CHECKSUMS' | sha256sum -c -
          ffcf786bd613f793a7658134b4261978cd249883d6b9ec839f41c56a261c6062  scripts/.tmp_core.00.b64
          bbd1cde9b58414aaa07cbbfed9a03f05dd60070e96b9cd6c0abfc2d3a3c94029  scripts/.tmp_core.01.b64
          80c82e2e75c50d97c1babbd24e5c0ea31c50170f3f9a72095f8dcf9bf343b242  scripts/.tmp_core.02.b64
          82839e53f3ffecf7ac13ff71e4452cf7e4f3ebbba2e282ba8369f8b5aebe5696  scripts/.tmp_core.03.b64
          0bf1f65c9e16f002d76b41643d5d9571e5a95f910fb5ce32b7ef35fc1f58c862  scripts/.tmp_providers.00.b64
          39fe2cce46a7861177ae57018190193659e01838b6429497e57cbe7cab8f93b6  scripts/.tmp_providers.01.b64
          a76ff504ba8425e9ab4c7cf79a791497143b4a7fa36d333cf39e7aa9163105cd  scripts/.tmp_providers.02.b64
          caf7137cd2fa84fd4a5655bc4bd3054097cd227657b591f870dcfc42944f33f1  scripts/.tmp_automation.00.b64
          b1a8ea3563a2e60dddc1cad3059ab13caae6edc891e2844b084937e28e27ccc4  scripts/.tmp_automation.01.b64
          755bb7002db2aaf5cdbf21b2047f0257b45f14c10a871a04e6e75e8d7bf2d82e  scripts/.tmp_automation.02.b64
          cab39bb30ac66b833f7b8e8922acfcd2f2df1127202381289ffc643b12f374e9  scripts/.tmp_automation.03.b64
          CHECKSUMS
          cat scripts/.tmp_core.*.b64 | base64 -d | gzip -d > /tmp/patch_core.py
          cat scripts/.tmp_providers.*.b64 | base64 -d | gzip -d > /tmp/patch_providers.py
          cat scripts/.tmp_automation.*.b64 | base64 -d | gzip -d > /tmp/patch_automation.py
          mkdir -p assets/audio
          cat scripts/.tmp_ringtone.00.b64 scripts/.tmp_ringtone.01.b64 scripts/.tmp_ringtone.02.b64 | base64 -d > assets/audio/connexio-ringtone.mp3
          base64 -d scripts/.tmp_notification.b64 > assets/audio/connexio-notification.mp3
          python -m py_compile /tmp/patch_core.py /tmp/patch_providers.py /tmp/patch_automation.py
          file assets/audio/connexio-ringtone.mp3 assets/audio/connexio-notification.mp3

      - name: Apply product corrections
        run: |
          python /tmp/patch_core.py
          python /tmp/patch_providers.py
          python /tmp/patch_automation.py

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript and tests
        run: npm run verify

      - name: Build web preview
        env:
          EXPO_PUBLIC_MOCK_MODE: true
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.com/v1/realtime
        run: npm run web:build

      - name: Commit validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/v14-governance-pass.yml \
                scripts/.tmp_patch_core.py.gz.b64 \
                scripts/.tmp_patch_providers.py.gz.b64 \
                scripts/.tmp_patch_automation.py.gz.b64 \
                scripts/.tmp_core.*.b64 \
                scripts/.tmp_providers.*.b64 \
                scripts/.tmp_automation.*.b64 \
                scripts/.tmp_ringtone.00.b64 \
                scripts/.tmp_ringtone.01.b64 \
                scripts/.tmp_ringtone.02.b64 \
                scripts/.tmp_notification.b64
          git add -A
          git commit -m "feat: enforce governance access media and custom sounds"
          git push origin HEAD:feat/v14-ux-calls-moderation
