name: Product Audit

on:
  push:
    branches:
      - main
      - release/connexio-rc1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install audit browser
        run: |
          npm install --no-save --package-lock=false playwright-core@1.58.2
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser >/dev/null 2>&1 || sudo apt-get install -y chromium >/dev/null 2>&1
      - name: Build web demonstration
        env:
          EXPO_PUBLIC_MOCK_MODE: "true"
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.com/v1/realtime
          EXPO_PUBLIC_EAS_PROJECT_ID: ""
          EXPO_PUBLIC_GITHUB_PAGES: "false"
        run: npx expo export --platform web --output-dir web-product-audit-dist
      - name: Run dedicated Map product audit
        run: node scripts/product-audit-v25.cjs
      - name: Run full multilingual audit
        run: node scripts/i18n-product-audit.cjs
      - name: Capture dedicated Map render review
        run: node scripts/v25-render-capture.cjs
      - name: Upload V26 render review
        uses: actions/upload-artifact@v4
        with:
          name: connexio-v26-render-review
          path: v26-render-review
          if-no-files-found: error
          retention-days: 14
      - name: Package downloadable web preview
        run: |
          cp TESTER_CONNEXIO.bat web-product-audit-dist/TESTER_CONNEXIO.bat
          cat > web-product-audit-dist/README_TEST.txt <<'EOF'
          CONNEXIO V26 — VERSION WEB DE DEMONSTRATION

          Cette archive contient le build web validé par Product Audit, y compris les évènements ancrés, la disponibilité personnelle et la visio Coworking principale/mosaïque.
          Pour un test immédiat sans backend, utilisez de préférence l'adresse GitHub Pages indiquée dans TESTER_EN_UN_CLIC.md.
          Pour lancer le projet complet depuis le dépôt sous Windows, utilisez TESTER_CONNEXIO.bat à la racine du dépôt.
          EOF
      - name: Upload downloadable web preview
        uses: actions/upload-artifact@v4
        with:
          name: connexio-v26-web-preview
          path: web-product-audit-dist
          if-no-files-found: error
          retention-days: 14
