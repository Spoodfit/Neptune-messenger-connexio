name: Product Audit

on:
  push:
    branches:
      - feat/production-hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-runtime-dependencies:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[lock-deps]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install Expo-compatible runtime dependencies
        run: npx expo install expo-image-picker expo-document-picker expo-location expo-video react-native-webview
      - name: Remove all temporary write mechanisms
        run: |
          python - <<'PY'
          from pathlib import Path

          product_audit = '''name: Product Audit

on:
  push:
    branches:
      - feat/production-hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install audit browser
        run: |
          npm install --no-save --package-lock=false playwright-core@1.58.2
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser >/dev/null 2>&1 || sudo apt-get install -y chromium >/dev/null 2>&1
      - name: Build web demonstration
        env:
          EXPO_PUBLIC_MOCK_MODE: "true"
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.com/v1/realtime
          EXPO_PUBLIC_CALL_BASE_URL: https://meet.jit.si
          EXPO_PUBLIC_EAS_PROJECT_ID: ""
          EXPO_PUBLIC_GITHUB_PAGES: "false"
        run: npx expo export --platform web --output-dir web-product-audit-dist
      - name: Run product audit
        run: node scripts/product-audit.cjs
'''
          Path('.github/workflows/product-audit.yml').write_text(product_audit)

          branch = Path('.github/workflows/branch-ci.yml')
          text = branch.read_text()
          start = text.find('  dependency-bootstrap:')
          end = text.find('\n  verify:', start)
          if start >= 0 and end >= 0:
              text = text[:start] + text[end + 1:]
          text = text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read')
          branch.write_text(text)

          for relative in (
              '.github/workflows/dependency-bootstrap.yml',
              'docs/DEPENDENCIES_BOOTSTRAP.md',
          ):
              file = Path(relative)
              if file.exists():
                  file.unlink()
          PY
      - name: Validate dependency compatibility
        run: npx expo install --check
      - name: Commit locked runtime and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: verrouiller le runtime natif final"
          git push origin HEAD:feat/production-hardening

  product-audit:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[lock-deps]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install audit browser
        run: |
          npm install --no-save --package-lock=false playwright-core@1.58.2
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser >/dev/null 2>&1 || sudo apt-get install -y chromium >/dev/null 2>&1
      - name: Build web demonstration
        env:
          EXPO_PUBLIC_MOCK_MODE: "true"
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.com/v1/realtime
          EXPO_PUBLIC_CALL_BASE_URL: https://meet.jit.si
          EXPO_PUBLIC_EAS_PROJECT_ID: ""
          EXPO_PUBLIC_GITHUB_PAGES: "false"
        run: npx expo export --platform web --output-dir web-product-audit-dist
      - name: Run product audit
        run: node scripts/product-audit.cjs
