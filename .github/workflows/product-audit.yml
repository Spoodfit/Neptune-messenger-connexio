name: Product Audit

on:
  push:
    branches:
      - feat/production-hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-front-fix:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'fix(front-final)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact frontend corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "app/(tabs)/highlights.tsx": [
                  (
                      'item === "feed" ? "Afficher le Feed" : "Afficher la Map"',
                      'item === "feed" ? "Afficher le Feed" : "Afficher la carte"',
                  )
              ],
              "app/(tabs)/messages.tsx": [
                  (
                      '            <View style={styles.sheetHandle} />\n',
                      '''            <View style={styles.sheetHandle} />
            <Pressable
              accessibilityRole="button"
              accessibilityLabel="Fermer les options de conversation"
              onPress={closeMenu}
              style={({ pressed }) => ({
                position: "absolute",
                top: 8,
                right: 10,
                width: 44,
                height: 44,
                zIndex: 2,
                borderRadius: 22,
                alignItems: "center",
                justifyContent: "center",
                opacity: pressed ? 0.62 : 1
              })}
            >
              <Ionicons name="close" size={21} color={colors.textMuted} />
            </Pressable>
''',
                  )
              ],
              "scripts/product-audit.cjs": [
                  (
                      '        await page.keyboard.press("Escape");\n',
                      '''        const closeOptions = page.getByLabel("Fermer les options de conversation");
        await expectVisible(closeOptions, "fermeture du menu de conversation");
        if (await closeOptions.isVisible().catch(() => false)) {
          await closeOptions.click();
          await page.waitForTimeout(180);
        }
''',
                  )
              ],
          }

          changed = False
          for path, pairs in replacements.items():
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              for old, new in pairs:
                  if new in content:
                      continue
                  if content.count(old) != 1:
                      raise SystemExit(f"{path}: motif source introuvable ou ambigu")
                  content = content.replace(old, new, 1)
                  changed = True
              file.write_text(content, encoding="utf-8")

          if not changed:
              print("Frontend déjà corrigé.")
          PY

          if git diff --quiet -- 'app/(tabs)/highlights.tsx' 'app/(tabs)/messages.tsx' scripts/product-audit.cjs; then
            exit 0
          fi

          git config user.name "Connexio CI"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/(tabs)/highlights.tsx' 'app/(tabs)/messages.tsx' scripts/product-audit.cjs
          git commit -m "fix(front-final): fermer les options et harmoniser la carte"
          git push origin HEAD:feat/production-hardening

  product-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install audit browser
        run: |
          npm install --no-save --package-lock=false playwright-core@1.58.2
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser >/dev/null 2>&1 || sudo apt-get install -y chromium >/dev/null 2>&1
      - name: Build web demonstration
        env:
          EXPO_PUBLIC_MOCK_MODE: "true"
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.com/v1/realtime
          EXPO_PUBLIC_EAS_PROJECT_ID: ""
          EXPO_PUBLIC_GITHUB_PAGES: "false"
        run: npx expo export --platform web --output-dir web-product-audit-dist
      - name: Run product audit
        run: node scripts/product-audit.cjs
