name: One-shot Connexio EAS status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-status-v23.yml

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: 1e85dc3a-4114-4387-8e15-2463a82e68fd
  EXPO_PUBLIC_MOCK_MODE: "true"
  EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
  EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com
  CONNEXIO_BUILD_ID: eec2fc81-a9d3-4094-8165-df9a05c8bf64

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read build status
        run: |
          mkdir -p builds
          npx --yes eas-cli@21.7.1 build:view "$CONNEXIO_BUILD_ID" --json > builds/eas-status-live.json
          cat builds/eas-status-live.json
      - name: Archive status
        uses: actions/upload-artifact@v4
        with:
          name: connexio-eas-status-v23
          path: builds/eas-status-live.json
          if-no-files-found: error
          retention-days: 7

