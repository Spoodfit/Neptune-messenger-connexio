name: Finalize RC1 store compliance and mobile UX

on:
  push:
    branches:
      - release/connexio-rc1
    paths:
      - .github/workflows/rc1-status-sounds-finalize-v2.yml
      - scripts/rc1_finalize_status_sounds.sh
      - scripts/rc1_mobile_store_patch.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connexio-rc1-store-ux-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout RC1
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Remove unsafe style heuristic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/rc1_mobile_store_patch.py")
          text = path.read_text(encoding="utf-8")
          old = "updated = patch_input_style_blocks(patch_numeric_design_tokens(text))"
          new = "updated = patch_numeric_design_tokens(text)"
          if text.count(old) != 1:
              raise SystemExit("Transformation heuristique des champs introuvable ou ambiguë.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply, audit and publish validated RC1
        run: bash scripts/rc1_finalize_status_sounds.sh
