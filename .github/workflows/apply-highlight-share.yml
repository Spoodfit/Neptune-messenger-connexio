name: Apply Highlight Share

on:
  push:
    branches:
      - feat/production-hardening

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[highlight-share]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          fetch-depth: 0
      - run: python scripts/apply_highlight_share.py
      - run: rm scripts/apply_highlight_share.py .github/workflows/apply-highlight-share.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/highlight/[id].tsx scripts/apply_highlight_share.py .github/workflows/apply-highlight-share.yml
          git commit -m "feat: partager depuis le détail d’un Temps fort"
          git push origin HEAD:feat/production-hardening
