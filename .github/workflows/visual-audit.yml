name: Visual Audit

on:
  push:
    branches:
      - feat/production-hardening

permissions:
  contents: write

concurrency:
  group: connexio-visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install visual audit tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 serve@14.2.4
          npx playwright install --with-deps chromium
      - name: Build web application
        env:
          EXPO_PUBLIC_MOCK_MODE: 'true'
          EXPO_PUBLIC_GITHUB_PAGES: 'false'
        run: npm run web:build
      - name: Capture responsive screens and inspect layout
        run: |
          rm -rf visual-audit-output
          mkdir -p visual-audit-output
          npx serve -s dist -l 4173 > visual-audit-output/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=commonjs > visual-audit-output/audit.log 2>&1 <<'NODE' || true
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const cases = [
              { name: 'messages-320x568', width: 320, height: 568, route: '/' },
              { name: 'messages-390x844', width: 390, height: 844, route: '/' },
              { name: 'messages-tablet-768x1024', width: 768, height: 1024, route: '/' },
              { name: 'communities-320x568', width: 320, height: 568, route: '/communities' },
              { name: 'contacts-320x568', width: 320, height: 568, route: '/contacts' },
              { name: 'settings-320x568', width: 320, height: 568, route: '/settings' },
              { name: 'chat-320x568', width: 320, height: 568, route: '/chat/carcassonne' },
              { name: 'chat-short-390x430', width: 390, height: 430, route: '/chat/carcassonne', focus: true },
              { name: 'readonly-320x568', width: 320, height: 568, route: '/chat/annonces' },
              { name: 'settings-zoom140-320x568', width: 320, height: 568, route: '/settings', zoom: 1.4 }
            ];
            const browser = await chromium.launch({ headless: true });
            const findings = [];
            try {
              for (const c of cases) {
                const context = await browser.newContext({
                  viewport: { width: c.width, height: c.height },
                  locale: 'fr-FR'
                });
                const page = await context.newPage();
                const consoleErrors = [];
                const pageErrors = [];
                page.on('console', (message) => {
                  if (message.type() === 'error') consoleErrors.push(message.text());
                });
                page.on('pageerror', (error) => pageErrors.push(String(error)));
                await page.goto(`http://127.0.0.1:4173${c.route}`, {
                  waitUntil: 'networkidle',
                  timeout: 30000
                });
                await page.waitForTimeout(500);
                if (c.zoom) {
                  await page.evaluate((zoom) => {
                    document.body.style.zoom = String(zoom);
                  }, c.zoom);
                  await page.waitForTimeout(250);
                }
                if (c.focus) {
                  const input = page.getByLabel('Écrire un message');
                  if (await input.count()) await input.focus();
                }
                const metrics = await page.evaluate(() => {
                  const width = window.innerWidth;
                  const interactive = Array.from(
                    document.querySelectorAll('button,input,textarea,[role="button"],a')
                  );
                  const clipped = interactive
                    .filter((element) => {
                      const style = getComputedStyle(element);
                      if (
                        style.display === 'none' ||
                        style.visibility === 'hidden' ||
                        style.opacity === '0'
                      ) {
                        return false;
                      }
                      const rect = element.getBoundingClientRect();
                      return rect.width > 0 && (rect.left < -1 || rect.right > width + 1);
                    })
                    .slice(0, 20)
                    .map((element) => {
                      const rect = element.getBoundingClientRect();
                      return {
                        text: (
                          element.getAttribute('aria-label') ||
                          element.textContent ||
                          ''
                        )
                          .trim()
                          .slice(0, 100),
                        left: rect.left,
                        right: rect.right
                      };
                    });
                  return {
                    viewportWidth: width,
                    viewportHeight: window.innerHeight,
                    scrollWidth: document.documentElement.scrollWidth,
                    scrollHeight: document.documentElement.scrollHeight,
                    horizontalOverflow:
                      document.documentElement.scrollWidth > width + 1,
                    clipped
                  };
                });
                await page.screenshot({
                  path: path.join('visual-audit-output', `${c.name}.jpg`),
                  type: 'jpeg',
                  quality: 62,
                  fullPage: true
                });
                findings.push({
                  ...c,
                  url: page.url(),
                  metrics,
                  consoleErrors,
                  pageErrors
                });
                await context.close();
              }
            } finally {
              await browser.close();
            }
            fs.writeFileSync(
              'visual-audit-output/report.json',
              JSON.stringify(findings, null, 2)
            );
            const failures = findings.filter(
              (item) =>
                item.metrics.horizontalOverflow ||
                item.metrics.clipped.length ||
                item.consoleErrors.length ||
                item.pageErrors.length
            );
            console.log(JSON.stringify(findings, null, 2));
            if (failures.length) process.exitCode = 1;
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Commit temporary visual evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-audit-output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture temporary visual audit evidence'
          git push origin HEAD:feat/production-hardening
