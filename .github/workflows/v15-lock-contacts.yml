name: V15 dependency lock

on:
  push:
    branches:
      - feat/v15-ux-relationship-navigation
    paths:
      - .github/workflows/v15-lock-contacts.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v15-ux-relationship-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Add Expo Contacts with SDK 57 compatible range
        run: |
          npm pkg set 'dependencies.expo-contacts=~57.0.2'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add Expo Contacts for explicit contact picking"
          git push origin HEAD:feat/v15-ux-relationship-navigation
