name: Refresh Expo SDK 57 lock

on:
  push:
    branches:
      - fix/v22-daily-messaging-stability
    paths:
      - .github/workflows/refresh-sdk57-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/v22-daily-messaging-stability
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Refresh SDK-compatible packages and lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund expo-audio@~57.0.4 expo-linking@~57.0.7
          npx expo install --check
      - name: Commit deterministic lock refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(expo): align SDK 57 audio and linking dependencies [skip ci]"
          git push origin HEAD:fix/v22-daily-messaging-stability
