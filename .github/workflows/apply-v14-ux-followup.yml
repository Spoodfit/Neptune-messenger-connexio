name: Stage adaptive highlight starter controls

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  staged-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Guarded patch source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, count))

          def write(path: str, content: str) -> None:
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content)

          replace(
              "app/new-highlight.tsx",
              '''        <ScrollView
horizontal
showsHorizontalScrollIndicator={false}
keyboardShouldPersistTaps="handled"
contentContainerStyle={styles.starterRow}
        >''',
              '''        <View style={styles.starterRow}>'''
          )

          replace(
              "app/new-highlight.tsx",
              '''        </ScrollView>
        <TextInput''',
              '''        </View>
        <TextInput'''
          )

          replace(
              "app/new-highlight.tsx",
              '''  starterRow: { gap: 7, paddingRight: 12, marginBottom: 9 },
  starterChip: { minHeight: 38, paddingHorizontal: 11, borderRadius: 999, borderWidth: 1, borderColor: colors.borderSoft, backgroundColor: colors.surfaceStrong, flexDirection: "row", alignItems: "center", gap: 6 },''',
              '''  starterRow: {
    flexDirection: "row",
    flexWrap: "wrap",
    gap: 7,
    marginBottom: 9
  },
  starterChip: {
    minHeight: 44,
    maxWidth: "100%",
    paddingHorizontal: 11,
    borderRadius: 999,
    borderWidth: 1,
    borderColor: colors.borderSoft,
    backgroundColor: colors.surfaceStrong,
    flexDirection: "row",
    alignItems: "center",
    gap: 6
  },'''
          )
          PY
