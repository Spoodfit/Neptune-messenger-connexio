              'import { isPrivateConversation } from "../../src/domain/conversationFilter";',
              'import { isPrivateConversation } from "../../src/domain/conversationFilter";\nimport { buildSmartReplySuggestions } from "../../src/domain/smartReplies";'
          )
          replace(
              "app/chat/[id].tsx",
              '  const submitLockRef = useRef(false);',
              '  const submitLockRef = useRef(false);\n  const composerInputRef = useRef<TextInput>(null);'
          )
          replace(
              "app/chat/[id].tsx",
              '''  const canSubmit = Boolean(
    conversation?.canPost &&
      !submitting &&
      (draft.trim() || pendingAttachments.length > 0)
  );''',
              '''  const latestIncomingMessage = messages.find((message) => !message.isMine);
  const smartReplies = useMemo(
    () => buildSmartReplySuggestions(latestIncomingMessage, currentUser),
    [currentUser, latestIncomingMessage]
  );
  const canSubmit = Boolean(
    conversation?.canPost &&
      !submitting &&
      (draft.trim() || pendingAttachments.length > 0)
  );'''
          )
          replace(
