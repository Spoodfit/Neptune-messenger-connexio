              '''  const insertMention = (name: string) => {
    setDraft((current) =>
      current.replace(/@[^\\s@]*$/u, `@${name.split(" ")[0]} `)
    );
  };
''',
              '''  const insertMention = (name: string) => {
    setDraft((current) =>
      current.replace(/@[^\\s@]*$/u, `@${name.split(" ")[0]} `)
    );
  };

  const useSmartReply = (reply: string) => {
