          write("src/domain/smartReplies.ts", r'''
          import type { AppUser, ChatMessage } from "../types/messaging";

          const normalize = (value: string) =>
            value.toLocaleLowerCase("fr").normalize("NFD").replace(/[\u0300-\u036f]/g, "");

          const unique = (items: string[]) => [...new Set(items)].slice(0, 3);

          export function buildSmartReplySuggestions(
            message: ChatMessage | undefined,
            currentUser: Pick<AppUser, "id" | "name" | "company">
          ): string[] {
            if (!message || message.isMine || !message.body.trim()) return [];

            const body = normalize(message.body);
            const firstName = currentUser.name.split(" ")[0] ?? currentUser.name;
            const mentionTokens = [firstName, currentUser.name, currentUser.company]
              .filter(Boolean)
              .map((value) => `@${normalize(value)}`);
            const mentioned =
              message.mentionedUserIds?.includes(currentUser.id) ||
              mentionTokens.some((token) => body.includes(token));
            const replies: string[] = [];

            if (mentioned) {
              replies.push(
                "Je viens de voir ta mention — je m’en occupe.",
                "Bien reçu, je te réponds juste après.",
                "Tu as besoin de quoi précisément ?"
              );
            }

            if (/\?|qui |quoi |quand |comment |pourquoi |est-ce|peux-tu|pouvez-vous/.test(body)) {
              replies.push(
                "Oui, je regarde ça.",
                "Je te réponds dans quelques minutes.",
                "Peux-tu me donner un peu plus de détails ?"
              );
            }

            if (/rdv|rendez-vous|creneau|dispo|disponible|agenda|heure|demain|vendredi|lundi/.test(body)) {
              replies.push(
                "Oui, c’est bon pour moi.",
                "Je vérifie mon agenda.",
                "Propose-moi deux créneaux."
              );
            }

            if (/merci|top|parfait|super|bravo/.test(body)) {
              replies.push("Avec plaisir !", "Merci à toi 🙌", "Parfait, on avance.");
            }

            if (/bonjour|salut|hello|coucou|bonsoir/.test(body)) {
              replies.push("Salut ! Comment vas-tu ?", "Bonjour 👋", "Ravi de te lire.");
            }

            return unique(replies);
          }
          ''')

          write("src/components/InlineVoiceRecorder.tsx", r'''
          import { Ionicons } from "@expo/vector-icons";
          import {
            RecordingPresets,
            requestRecordingPermissionsAsync,
            setAudioModeAsync,
            useAudioRecorder,
            useAudioRecorderState
          } from "expo-audio";
          import * as Crypto from "expo-crypto";
          import { LinearGradient } from "expo-linear-gradient";
          import { useEffect, useMemo, useRef, useState } from "react";
          import { ActivityIndicator, Alert, Pressable, StyleSheet, Text, View } from "react-native";

          import { colors, gradients } from "../theme";
          import type { MessageAttachment } from "../types/messaging";

          interface InlineVoiceRecorderProps {
            onCancel: () => void;
            onRecorded: (attachment: MessageAttachment) => void | Promise<void>;
            maxDurationSeconds?: number;
          }

          function formatDuration(seconds: number): string {
            const total = Math.max(0, Math.floor(seconds));
            return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
          }

          export function InlineVoiceRecorder({
            onCancel,
            onRecorded,
            maxDurationSeconds = 300
          }: InlineVoiceRecorderProps) {
            const recorder = useAudioRecorder(RecordingPresets.HIGH_QUALITY);
            const recorderState = useAudioRecorderState(recorder, 90);
            const [preparing, setPreparing] = useState(true);
            const [finishing, setFinishing] = useState(false);
            const mountedRef = useRef(true);
            const elapsedSeconds = recorderState.durationMillis / 1000;
            const waveform = useMemo(
              () =>
                Array.from({ length: 24 }, (_, index) => {
                  const phase = elapsedSeconds * 7 + index * 0.9;
                  return 7 + Math.round(Math.abs(Math.sin(phase)) * 22);
                }),
              [elapsedSeconds]
            );

            useEffect(() => {
              mountedRef.current = true;
              void (async () => {
                try {
                  const permission = await requestRecordingPermissionsAsync();
                  if (!permission.granted) {
                    throw new Error("Autorisez le microphone pour enregistrer un vocal.");
                  }
                  await setAudioModeAsync({
                    allowsRecording: true,
                    playsInSilentMode: true
                  });
                  await recorder.prepareToRecordAsync();
                  recorder.record({ forDuration: maxDurationSeconds });
                  if (mountedRef.current) setPreparing(false);
                } catch (error) {
                  Alert.alert(
                    "Microphone indisponible",
                    error instanceof Error ? error.message : "L’enregistrement vocal n’a pas pu démarrer."
                  );
                  onCancel();
                }
              })();

              return () => {
                mountedRef.current = false;
                if (recorder.isRecording) void recorder.stop().catch(() => undefined);
                void setAudioModeAsync({ allowsRecording: false }).catch(() => undefined);
              };
            }, [maxDurationSeconds, onCancel, recorder]);

            const cancel = async () => {
              if (finishing) return;
              setFinishing(true);
              if (recorder.isRecording) await recorder.stop().catch(() => undefined);
              await setAudioModeAsync({ allowsRecording: false }).catch(() => undefined);
              onCancel();
            };

            const send = async () => {
              if (finishing || preparing) return;
              setFinishing(true);
              try {
                if (recorder.isRecording) await recorder.stop();
                await setAudioModeAsync({ allowsRecording: false });
                const uri = recorder.uri;
                if (!uri) throw new Error("Le fichier vocal n’a pas été créé.");
                await onRecorded({
                  id: `local-voice-${Crypto.randomUUID()}`,
                  kind: "audio",
                  name: `vocal-${Date.now()}.m4a`,
                  uri,
                  mimeType: "audio/mp4",
                  durationSeconds: Math.max(1, Math.round(elapsedSeconds)),
                  status: "local",
                  uploadProgress: 0,
                  transcriptStatus: "pending"
                });
              } catch (error) {
                setFinishing(false);
                Alert.alert(
                  "Vocal indisponible",
                  error instanceof Error ? error.message : "Le vocal n’a pas pu être envoyé."
                );
              }
            };

            return (
              <View style={styles.shell} accessibilityLiveRegion="polite">
                <Pressable
                  accessibilityRole="button"
                  accessibilityLabel="Annuler le vocal"
                  onPress={() => void cancel()}
                  style={styles.action}
                >
                  <Ionicons name="trash-outline" size={20} color={colors.danger} />
                </Pressable>
                <View style={styles.recordingContent}>
                  <View style={styles.recordingHeader}>
                    <View style={styles.liveDot} />
                    <Text style={styles.timer}>{formatDuration(elapsedSeconds)}</Text>
                    <Text style={styles.status}>{preparing ? "Microphone…" : "Enregistrement"}</Text>
                  </View>
                  <View style={styles.waveform} accessibilityElementsHidden>
                    {waveform.map((height, index) => (
                      <View key={`inline-wave-${index}`} style={[styles.waveBar, { height }]} />
                    ))}
                  </View>
                </View>
                <Pressable
                  accessibilityRole="button"
                  accessibilityLabel="Envoyer le vocal"
                  accessibilityState={{ busy: finishing, disabled: preparing }}
                  disabled={preparing || finishing}
                  onPress={() => void send()}
                  style={styles.sendTarget}
                >
                  <LinearGradient colors={gradients.primary} style={styles.sendButton}>
                    {preparing || finishing ? (
                      <ActivityIndicator size="small" color={colors.white} />
                    ) : (
                      <Ionicons name="send" size={19} color={colors.white} />
                    )}
                  </LinearGradient>
                </Pressable>
              </View>
            );
          }

          const styles = StyleSheet.create({
            shell: {
              minHeight: 58,
              borderRadius: 22,
              borderWidth: 1,
              borderColor: "rgba(107,79,234,0.42)",
              backgroundColor: colors.surfaceStrong,
              flexDirection: "row",
              alignItems: "center",
              gap: 7,
              paddingHorizontal: 5,
              overflow: "hidden"
            },
            action: { width: 44, height: 48, alignItems: "center", justifyContent: "center" },
            recordingContent: { flex: 1, minWidth: 0 },
            recordingHeader: { flexDirection: "row", alignItems: "center", gap: 6 },
            liveDot: { width: 7, height: 7, borderRadius: 4, backgroundColor: colors.danger },
            timer: { color: colors.text, fontSize: 11, fontWeight: "900" },
            status: { color: colors.textMuted, fontSize: 9, fontWeight: "800" },
            waveform: { height: 31, flexDirection: "row", alignItems: "center", gap: 2, overflow: "hidden" },
            waveBar: { width: 2.5, borderRadius: 2, backgroundColor: colors.orange },
            sendTarget: { width: 50, height: 50, alignItems: "center", justifyContent: "center" },
            sendButton: { width: 42, height: 42, borderRadius: 15, alignItems: "center", justifyContent: "center" }
          });
          ''')

          write("src/components/VoicePromptInput.tsx", r'''
          import { Ionicons } from "@expo/vector-icons";
          import * as Speech from "expo-speech";
          import {
            ExpoSpeechRecognitionModule,
            useSpeechRecognitionEvent
          } from "expo-speech-recognition";
          import { useEffect, useMemo, useRef, useState } from "react";
          import { Alert, Pressable, StyleSheet, Text, TextInput, View } from "react-native";

          import { colors } from "../theme";

          interface VoicePromptInputProps {
            value: string;
            onChangeText: (value: string) => void;
            placeholder: string;
            prompt: string;
            maxLength: number;
          }

          export function VoicePromptInput({
            value,
            onChangeText,
            placeholder,
            prompt,
            maxLength
          }: VoicePromptInputProps) {
            const [listening, setListening] = useState(false);
            const [volume, setVolume] = useState(0);
            const [error, setError] = useState<string | null>(null);
            const promptedRef = useRef(false);
            const bars = useMemo(
              () => Array.from({ length: 7 }, (_, index) => 8 + Math.max(0, volume) * (1 + (index % 3) * 0.25)),
              [volume]
            );

            useSpeechRecognitionEvent("start", () => {
              setListening(true);
              setError(null);
            });
            useSpeechRecognitionEvent("end", () => {
              setListening(false);
              setVolume(0);
            });
            useSpeechRecognitionEvent("result", (event) => {
              const transcript = event.results[0]?.transcript?.trim();
              if (transcript) onChangeText(transcript.slice(0, maxLength));
            });
            useSpeechRecognitionEvent("volumechange", (event) => {
              setVolume(Math.max(0, event.value));
            });
            useSpeechRecognitionEvent("error", (event) => {
              if (event.error === "aborted") return;
              setListening(false);
              setError(event.message || "La dictée a été interrompue.");
            });

            useEffect(() => {
              if (promptedRef.current) return;
              promptedRef.current = true;
              const timer = setTimeout(() => {
                Speech.speak(prompt, { language: "fr-FR", rate: 0.92, pitch: 1 });
              }, 260);
              return () => {
                clearTimeout(timer);
                Speech.stop();
                ExpoSpeechRecognitionModule.abort();
              };
            }, [prompt]);

            const toggleListening = async () => {
              if (listening) {
                ExpoSpeechRecognitionModule.stop();
                return;
              }
              try {
                await Speech.stop();
                const permission = await ExpoSpeechRecognitionModule.requestPermissionsAsync();
                if (!permission.granted) {
                  throw new Error("Autorisez le microphone et la reconnaissance vocale pour dicter l’objet de l’appel.");
                }
                ExpoSpeechRecognitionModule.start({
                  lang: "fr-FR",
                  interimResults: true,
                  continuous: false,
                  maxAlternatives: 1,
                  volumeChangeEventOptions: { enabled: true, intervalMillis: 120 }
                });
              } catch (recognitionError) {
                const message = recognitionError instanceof Error
                  ? recognitionError.message
                  : "La dictée vocale n’est pas disponible sur cet appareil.";
                setError(message);
                Alert.alert("Dictée indisponible", message);
              }
            };

            return (
              <View>
                <View style={[styles.field, listening && styles.fieldListening]}>
                  <TextInput
                    value={value}
                    onChangeText={onChangeText}
                    placeholder={placeholder}
                    placeholderTextColor={colors.textMuted}
                    maxLength={maxLength}
                    multiline
                    textAlignVertical="top"
                    style={styles.input}
                  />
                  <Pressable
                    accessibilityRole="button"
                    accessibilityLabel={listening ? "Arrêter la dictée" : "Dicter l’objet de l’appel"}
                    accessibilityState={{ selected: listening }}
                    onPress={() => void toggleListening()}
                    style={[styles.micButton, listening && styles.micButtonListening]}
                  >
                    <Ionicons name={listening ? "stop" : "mic"} size={21} color={colors.white} />
                  </Pressable>
                </View>
                <View style={styles.voiceStatus}>
                  <View style={styles.waveform} accessibilityElementsHidden>
                    {bars.map((height, index) => (
                      <View key={`prompt-wave-${index}`} style={[styles.waveBar, { height: listening ? Math.min(25, height) : 5 }]} />
                    ))}
                  </View>
                  <Text style={[styles.hint, error && styles.error]} numberOfLines={2}>
                    {error ?? (listening ? "Je vous écoute…" : "Touchez le micro puis parlez.")}
                  </Text>
                </View>
              </View>
            );
          }

          const styles = StyleSheet.create({
            field: {
              minHeight: 96,
              marginTop: 8,
              padding: 6,
              borderRadius: 17,
              borderWidth: 1,
              borderColor: colors.borderSoft,
              backgroundColor: colors.surfaceStrong,
              flexDirection: "row",
              alignItems: "flex-end",
              gap: 5
            },
            fieldListening: { borderColor: colors.violet },
            input: { flex: 1, minHeight: 82, padding: 7, color: colors.text, fontSize: 14, lineHeight: 20 },
            micButton: { width: 44, height: 44, borderRadius: 16, backgroundColor: colors.primary, alignItems: "center", justifyContent: "center" },
            micButtonListening: { backgroundColor: colors.danger },
            voiceStatus: { minHeight: 28, marginTop: 5, flexDirection: "row", alignItems: "center", gap: 8 },
            waveform: { width: 52, height: 25, flexDirection: "row", alignItems: "center", gap: 2 },
            waveBar: { width: 4, borderRadius: 2, backgroundColor: colors.orange },
            hint: { flex: 1, color: colors.textMuted, fontSize: 9.5, fontWeight: "800" },
            error: { color: colors.danger }
          });
          ''')

          # Chat: smart reply chips and inline, one-step voice sending.
          replace(
              "app/chat/[id].tsx",
              'import { MessageBubble } from "../../src/components/MessageBubble";\nimport { PollComposerModal } from "../../src/components/PollComposerModal";\nimport VoiceRecorderModal from "../../src/components/VoiceRecorderModal";',
              'import { InlineVoiceRecorder } from "../../src/components/InlineVoiceRecorder";\nimport { MessageBubble } from "../../src/components/MessageBubble";\nimport { PollComposerModal } from "../../src/components/PollComposerModal";'
          )
          replace(
