name: Apply Message Transport

on:
  push:
    branches:
      - feat/production-hardening

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[message-transport]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          fetch-depth: 0
      - name: Apply strict transport patch
        run: python scripts/apply_message_transport.py
      - name: Remove one-off patch machinery
        run: rm scripts/apply_message_transport.py .github/workflows/apply-message-transport.yml
      - name: Commit product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/MessagingProvider.tsx scripts/apply_message_transport.py .github/workflows/apply-message-transport.yml
          git commit -m "feat: transporter réellement médias et mentions"
          git push origin HEAD:feat/production-hardening
