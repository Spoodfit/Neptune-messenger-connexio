name: UX Round 2 Apply

on:
  push:
    branches:
      - fix/connexio-ux-round2-20260814

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply targeted UX codemod
        run: python3 scripts/ux-round2-codemod-v2.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and domain verification
        run: npm run verify --silent
      - name: Native-dialog and gesture regression audit
        run: |
          set -euo pipefail
          if grep -RIn --include='*.ts' --include='*.tsx' -E '(^|[^A-Za-z0-9_])Alert\.alert|ToastAndroid|ActionSheetIOS|SwipeTabShell|EdgeSwipeBack' app src; then
            echo 'Forbidden native/gesture UX primitive remains.'
            exit 1
          fi
      - name: Commit generated UX fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app src
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'fix: apply Connexio UX second pass'
          git push origin HEAD:fix/connexio-ux-round2-20260814
