name: Fix Product Audit locale setup

on:
  push:
    branches:
      - fix/connexio-light-i18n-20260815
    paths:
      - .github/workflows/fix-product-audit-locale.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/connexio-light-i18n-20260815
      - name: Force the baseline audit locale to French
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/product-audit.cjs')
          source = path.read_text()
          source = source.replace(
              'browser.newPage({ viewport: { width, height }, reducedMotion: "reduce" })',
              'browser.newPage({ viewport: { width, height }, reducedMotion: "reduce", locale: "fr-FR" })'
          )
          source = source.replace(
              'browser.newPage({ viewport: { width: 390, height: 844 } })',
              'browser.newPage({ viewport: { width: 390, height: 844 }, locale: "fr-FR" })'
          )
          path.write_text(source)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/product-audit.cjs
          git commit -m 'test: pin Product Audit baseline locale to French'
          git push origin HEAD:fix/connexio-light-i18n-20260815
