name: Deploy RC1 preview to GitHub Pages

on:
  push:
    branches:
      - release/connexio-rc1
      - store/go-store-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connexio-rc1-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web preview and public store documents
        env:
          EXPO_PUBLIC_MOCK_MODE: "true"
          EXPO_PUBLIC_GITHUB_PAGES: "true"
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.invalid/v1/realtime
          EXPO_PUBLIC_PRIVACY_POLICY_URL: https://neptunebusinessclub.github.io/Neptune-messenger-connexio/privacy-policy.html
          EXPO_PUBLIC_TERMS_URL: https://neptunebusinessclub.github.io/Neptune-messenger-connexio/connexio-terms.html
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: https://neptunebusinessclub.github.io/Neptune-messenger-connexio/account-deletion.html
          EXPO_PUBLIC_SUPPORT_URL: mailto:contact@neptunebusiness.com
        run: npm run web:build

      - name: Ensure store policy documents are published
        run: |
          test -f dist/privacy-policy.html
          test -f dist/connexio-terms.html
          test -f dist/account-deletion.html

      - name: Adapt build for project Pages URL
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('dist')
          prefix = '/Neptune-messenger-connexio'
          text_extensions = {'.html', '.js', '.css', '.json', '.map'}

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              text = text.replace('"/_expo/', f'"{prefix}/_expo/')
              text = text.replace("'/_expo/", f"'{prefix}/_expo/")
              text = text.replace('"/assets/', f'"{prefix}/assets/')
              text = text.replace("'/assets/", f"'{prefix}/assets/")
              text = text.replace('url(/assets/', f'url({prefix}/assets/')
              path.write_text(text, encoding='utf-8')

          index = root / 'index.html'
          (root / '404.html').write_text(index.read_text(encoding='utf-8'), encoding='utf-8')
          (root / '.nojekyll').write_text('', encoding='utf-8')
          PY

      - name: Publish preview
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Connexio preview ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
