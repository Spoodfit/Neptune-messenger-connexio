name: Apply and verify Connexio UX fixes

on:
  push:
    branches:
      - fix/connexio-ux-20260814

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final UX patches
        run: node scripts/apply-connexio-ux-finalize-v2.cjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and tests
        run: npm run verify

      - name: Release-candidate audit
        run: npm run audit:rc

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: Commit verified application changes
        run: |
          git rm scripts/apply-connexio-ux-finalize.cjs scripts/apply-connexio-ux-finalize-v2.cjs .github/workflows/connexio-ux-fix-verify.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "fix: polish contacts calls gestures and light theme"
          git push origin "HEAD:${GITHUB_REF_NAME}"
