name: Run requested V14 interaction polish

on:
  pull_request:
    branches:
      - feat/production-hardening
    types:
      - synchronize
      - opened
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v14-ux-calls-moderation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Execute product patch
        shell: bash
        run: |
          python <<'RUNNER'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/apply-v14-ux-followup.yml').read_text()
          marker_start = "          python <<'PY'\n"
          marker_end = "\n          PY\n"
          if marker_start not in workflow or marker_end not in workflow:
              raise SystemExit('Embedded product patch was not found.')
          embedded = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          tolerant_function = r'''def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, count))
                  return
              parts = []
              for line in old.splitlines():
                  stripped = line.strip()
                  if not stripped:
                      parts.append(r"[ \t]*")
                      continue
                  tokens = re.split(r"([ \t]+)", stripped)
                  body = "".join(
                      r"[ \t]+" if token and token.isspace() else re.escape(token)
                      for token in tokens
                  )
                  parts.append(r"[ \t]*" + body)
              pattern = r"\n".join(parts)
              if old.endswith("\n"):
                  pattern += r"\n"
              updated, substitutions = re.subn(pattern, lambda _: new, text, count=count)
              if substitutions == 0:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:120]!r}")
              file.write_text(updated)'''
          script, substitutions = re.subn(
              r'def replace\(path: str, old: str, new: str, count: int = 1\) -> None:\n.*?\n\ndef write',
              lambda _: tolerant_function + '\n\ndef write',
              script,
              count=1,
              flags=re.S
          )
          if substitutions != 1:
              raise SystemExit('Patch helper could not be replaced safely.')
          exec(compile(script, '<v14-product-patch>', 'exec'), {'__name__': '__main__', 're': re})

          config_path = Path('app.config.ts')
          config = config_path.read_text()
          if '      "expo-audio",\n' not in config:
              anchor = '      "expo-router",\n'
              if anchor not in config:
                  raise SystemExit('Expo plugin anchor not found.')
              config = config.replace(anchor, anchor + '      "expo-audio",\n', 1)
              config_path.write_text(config)

          schedule_path = Path('app/schedule-message/[id].tsx')
          schedule = schedule_path.read_text()
          schedule_anchor = '  const initialDate = useMemo(() => PRESETS[2].resolve(new Date()), []);'
          schedule_replacement = '''  const initialDate = useMemo(
    () =>
      PRESETS.find((preset) => preset.id === "tomorrow-nine")?.resolve(new Date()) ??
      new Date(Date.now() + 24 * 60 * 60 * 1000),
    []
  );'''
          if schedule_anchor in schedule:
              schedule_path.write_text(schedule.replace(schedule_anchor, schedule_replacement, 1))
          RUNNER

      - name: Install compatible audio and speech modules
        run: npm install expo-speech-recognition@56.0.1 expo-audio@~57.0.2 expo-speech@~57.0.1

      - name: Verify TypeScript and domain tests
        run: npm run verify

      - name: Commit verified changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-v14-ux-followup.yml
          rm -f .github/workflows/run-v14-ux-followup.yml
          git config user.name "Neptune Product Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: polish reactions, smart replies and voice UX"
          git push origin HEAD:feat/v14-ux-calls-moderation
