name: Web Preview

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/production-hardening
      - feat/mvp-mobile-messenger
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build web preview
        env:
          EXPO_PUBLIC_GITHUB_PAGES: "true"
          EXPO_PUBLIC_MOCK_MODE: "true"
        run: npm run web:build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always() && github.event_name == 'push' && github.ref_name == 'feat/production-hardening'
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    steps:
      - name: Publish preview status on PR 3
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- connexio-web-preview -->';
            const pageUrl = process.env.PAGE_URL || 'https://neptunebusinessclub.github.io/Neptune-messenger-connexio/';
            const ok = process.env.BUILD_RESULT === 'success' && process.env.DEPLOY_RESULT === 'success';
            const body = `${marker}\n## Prévisualisation Connexio\n\n- Build : **${process.env.BUILD_RESULT}**\n- Déploiement : **${process.env.DEPLOY_RESULT}**\n- Commit : \`${context.sha}\`\n- Exécution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n${ok ? `✅ [Ouvrir la démonstration](${pageUrl})` : '❌ La prévisualisation n’est pas encore accessible. Ouvrir l’exécution ci-dessus pour voir le blocage.'}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 3,
                body
              });
            }
