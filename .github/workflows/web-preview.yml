name: Web Preview

on:
  push:
    branches:
      - feat/mvp-mobile-messenger
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install --silent --no-audit --no-fund

      - name: Install Expo web dependencies
        run: npx expo install react-dom react-native-web @expo/metro-runtime

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build web preview
        env:
          EXPO_PUBLIC_GITHUB_PAGES: "true"
          EXPO_PUBLIC_MOCK_MODE: "true"
        run: npx expo export -p web

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: connexio-web-preview
          path: dist
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
