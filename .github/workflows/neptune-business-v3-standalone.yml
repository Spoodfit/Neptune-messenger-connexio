name: Build Neptune Business V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/neptune-business-v3
    paths:
      - .github/workflows/neptune-business-v3-standalone.yml

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build-android:
    name: Neptune V3 Android standalone
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build/neptune-business-v3
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Download exact Neptune V3 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf neptune-v3
          mkdir -p neptune-v3
          curl -fL --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3EZW6TPL6PWjv4UXWqjVzgkha48/8d928331-a834-468c-b931-8dd1036e6e1a.gz' \
            -o /tmp/neptune-v3.tar.gz
          test "$(wc -c < /tmp/neptune-v3.tar.gz)" = "2734466"
          tar -xzf /tmp/neptune-v3.tar.gz -C neptune-v3
          test -f neptune-v3/package.json
          test -f neptune-v3/app.json
          test -f neptune-v3/eas.json

      - name: Install dependencies
        working-directory: neptune-v3
        run: npm install --no-audit --no-fund

      - name: Verify TypeScript and Expo dependencies
        working-directory: neptune-v3
        run: |
          npm run typecheck
          npx expo install --check

      - name: Authenticate Expo
        working-directory: neptune-v3
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@21.7.1 whoami

      - name: Link existing Neptune Business Expo project
        working-directory: neptune-v3
        run: |
          npx --yes eas-cli@21.7.1 init --non-interactive --force
          npx --yes eas-cli@21.7.1 project:info --json | tee eas-project-info.json

      - name: Verify Android native prebuild
        working-directory: neptune-v3
        env:
          EXPO_DEBUG: "1"
          EXPO_CONFIG_PLUGIN_VERBOSE_ERRORS: "1"
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install
          test -x android/gradlew
          test -f android/app/build.gradle
          rm -rf android

      - name: Build installable APK on EAS Cloud
        id: eas
        working-directory: neptune-v3
        shell: bash
        run: |
          set +e
          npx --yes eas-cli@21.7.1 build \
            --profile standalone \
            --platform android \
            --non-interactive \
            --wait \
            --clear-cache \
            --json > eas-build-android.json 2> eas-build-android.stderr
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat eas-build-android.stderr || true
          cat eas-build-android.json || true

      - name: Create build report
        if: always()
        shell: bash
        env:
          EAS_CODE: ${{ steps.eas.outputs.code }}
        run: |
          mkdir -p builds
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.existsSync('neptune-v3/eas-build-android.json')
            ? fs.readFileSync('neptune-v3/eas-build-android.json', 'utf8')
            : '';
          let parsed = null;
          let parseError = null;
          try { parsed = raw.trim() ? JSON.parse(raw) : null; }
          catch (error) { parseError = String(error); }
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const report = {
            easCode: process.env.EAS_CODE === '' || process.env.EAS_CODE == null ? null : Number(process.env.EAS_CODE),
            buildId: build?.id || null,
            status: build?.status || null,
            platform: build?.platform || 'ANDROID',
            buildProfile: build?.buildProfile || 'standalone',
            appVersion: build?.appVersion || null,
            appBuildVersion: build?.appBuildVersion || null,
            createdAt: build?.createdAt || null,
            completedAt: build?.completedAt || null,
            artifactUrl: build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || null,
            buildDetailsUrl: build?.buildDetailsPageUrl || null,
            parseError
          };
          fs.writeFileSync('builds/neptune-v3-latest.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neptune-v3-android-build-report
          path: builds/neptune-v3-latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail if EAS build failed
        if: always()
        shell: bash
        env:
          EAS_CODE: ${{ steps.eas.outputs.code }}
        run: test "${EAS_CODE:-1}" = "0"
