name: Build native release candidate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme à construire
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-release-candidate.yml

permissions:
  contents: write

jobs:
  eas-status:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
    steps:
      - name: Récupérer la release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Vérifier les accès EAS
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@21.7.1 whoami
      - name: Lire les builds Android EAS
        run: |
          mkdir -p builds
          npx --yes eas-cli@21.7.1 build:list --platform android --limit 10 --json --non-interactive > builds/eas-android-status.json
          cat builds/eas-android-status.json
      - name: Publier le statut dans la release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/eas-android-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(build): record EAS Android status [skip ci]"
          git push origin HEAD:release/connexio-rc1

  eas-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
    steps:
      - name: Vérifier les accès EAS
        run: test -n "$EXPO_TOKEN" || { echo "Secret EXPO_TOKEN manquant"; exit 1; }
      - name: Récupérer la release candidate validée
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Vérifier la release candidate
        run: npm run verify && npm run audit:rc && npx expo install --check
      - name: Construire avec EAS
        run: npx eas-cli@21.7.1 build --profile release-candidate --platform "${{ inputs.platform }}" --non-interactive --wait
