name: Discover Connexio Expo project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-release-candidate.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Verify Expo token
        run: test -n "$EXPO_TOKEN"
      - name: Enumerate Expo projects visible to the token
        shell: bash
        run: |
          mkdir -p builds
          node - <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const token = process.env.EXPO_TOKEN;
          const query = `query CurrentActorProjects {
            meActor {
              __typename
              accounts { id name }
              ... on User {
                username
                apps(includeUnpublished: true, limit: 100, offset: 0) { id fullName }
              }
              ... on SSOUser {
                username
                apps(includeUnpublished: true, limit: 100, offset: 0) { id fullName }
              }
            }
          }`;
          const body = JSON.stringify({ query, variables: {} });
          const req = https.request('https://api.expo.dev/graphql', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(body)
            }
          }, (res) => {
            let data = '';
            res.on('data', (chunk) => data += chunk);
            res.on('end', () => {
              let json = null;
              try { json = JSON.parse(data); } catch (error) {
                json = { parseError: String(error), raw: data.slice(0, 4000) };
              }
              const output = { statusCode: res.statusCode, response: json };
              fs.writeFileSync('builds/new-expo-project.json', JSON.stringify(output, null, 2) + '\n');
              console.log(JSON.stringify(output, null, 2));
              if (!json?.data?.meActor) process.exitCode = 2;
            });
          });
          req.on('error', (error) => {
            fs.writeFileSync('builds/new-expo-project.json', JSON.stringify({ error: String(error) }, null, 2) + '\n');
            console.error(error);
            process.exitCode = 2;
          });
          req.write(body);
          req.end();
          NODE
      - name: Publish discovery result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/new-expo-project.json
          git commit -m "chore(expo): record accessible EAS projects [skip ci]" || true
          git push origin HEAD:release/connexio-rc1
