name: Build native release candidate

run-name: Build Android RC from release/connexio-rc1

on:
  push:
    branches:
      - build/android-rc-20260813
    paths:
      - .github/workflows/native-release-candidate.yml

permissions:
  contents: read

concurrency:
  group: connexio-native-rc-android
  cancel-in-progress: false

jobs:
  eas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
    steps:
      - name: Vérifier les accès EAS
        run: test -n "$EXPO_TOKEN" || { echo "Secret EXPO_TOKEN manquant"; exit 1; }

      - name: Récupérer la release candidate validée
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1

      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund

      - name: Vérifier la release candidate
        run: npm run verify && npm run audit:rc && npx expo install --check

      - name: Construire Android avec EAS
        run: npx eas-cli@21.7.1 build --profile release-candidate --platform android --non-interactive --wait
