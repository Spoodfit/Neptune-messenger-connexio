name: Build Connexio V23 on Expo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-release-candidate.yml

permissions:
  contents: write

concurrency:
  group: connexio-v23-new-eas-project
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: 1e85dc3a-4114-4387-8e15-2463a82e68fd
  EXPO_PUBLIC_MOCK_MODE: "true"
  EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
  EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest V23 release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Relink release to new Expo project
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const newId = '1e85dc3a-4114-4387-8e15-2463a82e68fd';
          const oldId = 'd2288b09-8249-4879-810f-7cb0072baeeb';

          let appConfig = fs.readFileSync('app.config.ts', 'utf8');
          appConfig = appConfig.replace(`const EAS_PROJECT_ID = "${oldId}";`, `const EAS_PROJECT_ID = "${newId}";`);
          appConfig = appConfig.replace('    slug: "neptune",', '    owner: "johanzambellis-team",\n    slug: "connexio",');
          fs.writeFileSync('app.config.ts', appConfig);

          let envExample = fs.readFileSync('.env.example', 'utf8');
          envExample = envExample.replace(oldId, newId);
          fs.writeFileSync('.env.example', envExample);

          const workflow = '.github/workflows/native-standalone.yml';
          let standalone = fs.readFileSync(workflow, 'utf8');
          standalone = standalone.replaceAll(oldId, newId);
          fs.writeFileSync(workflow, standalone);

          if (!fs.readFileSync('app.config.ts','utf8').includes(`const EAS_PROJECT_ID = "${newId}";`)) throw new Error('projectId Expo non remplacé');
          if (!fs.readFileSync('app.config.ts','utf8').includes('owner: "johanzambellis-team"')) throw new Error('owner Expo non configuré');
          if (!fs.readFileSync('app.config.ts','utf8').includes('slug: "connexio"')) throw new Error('slug Expo non configuré');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.config.ts .env.example .github/workflows/native-standalone.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(expo): link Connexio to johanzambellis team"
            git push origin HEAD:release/connexio-rc1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Expo account and project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@21.7.1 whoami
          npx --yes eas-cli@21.7.1 project:info --json | tee eas-project-info.json
      - name: Verify V23 release
        run: npm run verify && npm run audit:rc && npx expo install --check
      - name: Build Android standalone APK on EAS Cloud
        id: eas
        shell: bash
        run: |
          set +e
          npx --yes eas-cli@21.7.1 build \
            --profile standalone \
            --platform android \
            --non-interactive \
            --wait \
            --clear-cache \
            --json > eas-build-android.json 2> eas-build-android.stderr
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat eas-build-android.stderr || true
          cat eas-build-android.json || true
      - name: Record build result
        if: always()
        shell: bash
        env:
          EAS_CODE: ${{ steps.eas.outputs.code }}
        run: |
          mkdir -p builds
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.existsSync('eas-build-android.json') ? fs.readFileSync('eas-build-android.json','utf8') : '';
          const stderr = fs.existsSync('eas-build-android.stderr') ? fs.readFileSync('eas-build-android.stderr','utf8') : '';
          const projectInfo = fs.existsSync('eas-project-info.json') ? fs.readFileSync('eas-project-info.json','utf8') : '';
          let parsed = null;
          let parseError = null;
          try { parsed = raw.trim() ? JSON.parse(raw) : null; } catch (error) { parseError = String(error); }
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const artifactUrl = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || null;
          const result = {
            easCode: process.env.EAS_CODE === '' || process.env.EAS_CODE == null ? null : Number(process.env.EAS_CODE),
            projectId: process.env.EXPO_PUBLIC_EAS_PROJECT_ID,
            projectInfo: projectInfo.slice(-4000),
            buildId: build?.id || null,
            status: build?.status || null,
            gitCommitHash: build?.gitCommitHash || null,
            appVersion: build?.appVersion || null,
            appBuildVersion: build?.appBuildVersion || null,
            artifactUrl,
            parseError,
            stderr: stderr.slice(-12000)
          };
          fs.writeFileSync('builds/new-expo-build.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/new-expo-build.json
          git commit -m "build(expo): record new Connexio EAS build [skip ci]" || true
          git push origin HEAD:release/connexio-rc1
          test "${EAS_CODE:-1}" = "0"

