name: Build native release candidate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme à construire
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-release-candidate.yml

permissions:
  contents: write

concurrency:
  group: connexio-v23-standalone-android
  cancel-in-progress: true

jobs:
  standalone-android:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
      EXPO_PUBLIC_MOCK_MODE: "true"
      EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
      EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com
    steps:
      - name: Récupérer la release V23
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Préflight V23
        id: preflight
        shell: bash
        run: |
          mkdir -p builds
          : > builds/latest-android-attempt.log
          set +e
          {
            echo '===== whoami ====='
            test -n "$EXPO_TOKEN" && npx --yes eas-cli@21.7.1 whoami
            echo '===== project ====='
            npx --yes eas-cli@21.7.1 project:info --json
            echo '===== verify ====='
            npm run verify
            echo '===== rc-audit ====='
            npm run audit:rc
            echo '===== expo-check ====='
            npx expo install --check
            echo '===== expo-config ====='
            npx expo config --type public
          } > builds/latest-android-attempt.log 2>&1
          code=$?
          set -e
          echo "preflight_code=$code" >> "$GITHUB_OUTPUT"
          cat builds/latest-android-attempt.log
      - name: Soumettre et attendre le nouvel APK EAS
        id: eas
        if: steps.preflight.outputs.preflight_code == '0'
        shell: bash
        run: |
          set +e
          npx --yes eas-cli@21.7.1 build \
            --profile standalone \
            --platform android \
            --non-interactive \
            --wait \
            --clear-cache \
            --json > eas-build-android.json 2> eas-build-android.stderr
          code=$?
          set -e
          echo "eas_code=$code" >> "$GITHUB_OUTPUT"
          cat eas-build-android.stderr || true
          cat eas-build-android.json || true
      - name: Publier le résultat de tentative dans la release
        if: always()
        shell: bash
        env:
          PREFLIGHT_CODE: ${{ steps.preflight.outputs.preflight_code }}
          EAS_CODE: ${{ steps.eas.outputs.eas_code }}
        run: |
          mkdir -p builds
          node - <<'NODE'
          const fs = require('fs');
          const preflightCode = Number(process.env.PREFLIGHT_CODE || '1');
          const easCode = process.env.EAS_CODE === '' || process.env.EAS_CODE == null ? null : Number(process.env.EAS_CODE);
          const raw = fs.existsSync('eas-build-android.json') ? fs.readFileSync('eas-build-android.json','utf8') : '';
          const stderr = fs.existsSync('eas-build-android.stderr') ? fs.readFileSync('eas-build-android.stderr','utf8') : '';
          const preflight = fs.existsSync('builds/latest-android-attempt.log') ? fs.readFileSync('builds/latest-android-attempt.log','utf8') : '';
          let parsed = null;
          let parseError = null;
          try { parsed = raw.trim() ? JSON.parse(raw) : null; } catch (error) { parseError = String(error); }
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const artifactUrl = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || null;
          const attempt = {
            preflightCode,
            easCode,
            buildId: build?.id || null,
            status: build?.status || null,
            gitCommitHash: build?.gitCommitHash || null,
            appVersion: build?.appVersion || null,
            appBuildVersion: build?.appBuildVersion || null,
            artifactUrl,
            parseError,
            stderr: stderr.slice(-8000),
            preflightTail: preflight.slice(-8000)
          };
          fs.writeFileSync('builds/latest-android-attempt.json', JSON.stringify(attempt, null, 2) + '\n');
          if (preflightCode === 0 && easCode === 0 && build?.status === 'FINISHED' && artifactUrl?.endsWith('.apk')) {
            fs.writeFileSync('builds/latest-android-standalone.json', JSON.stringify({
              id: build.id,
              status: build.status,
              platform: build.platform,
              buildProfile: build.buildProfile || 'standalone',
              sdkVersion: build.sdkVersion || null,
              appVersion: build.appVersion || null,
              appBuildVersion: build.appBuildVersion || null,
              gitCommitHash: build.gitCommitHash || null,
              createdAt: build.createdAt || null,
              completedAt: build.completedAt || null,
              artifactUrl
            }, null, 2) + '\n');
          }
          console.log(JSON.stringify(attempt, null, 2));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/latest-android-attempt.json
          if [ -f builds/latest-android-standalone.json ]; then git add -f builds/latest-android-standalone.json; fi
          git commit -m "build(android): record V23 EAS attempt [skip ci]" || true
          git push origin HEAD:release/connexio-rc1
          preflight_code="${PREFLIGHT_CODE:-1}"
          eas_code="${EAS_CODE:-1}"
          if [ "$preflight_code" != "0" ] || [ "$eas_code" != "0" ]; then exit 1; fi

  eas-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
    steps:
      - name: Vérifier les accès EAS
        run: test -n "$EXPO_TOKEN" || { echo "Secret EXPO_TOKEN manquant"; exit 1; }
      - name: Récupérer la release candidate validée
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Vérifier la release candidate
        run: npm run verify && npm run audit:rc && npx expo install --check
      - name: Construire avec EAS
        run: npx eas-cli@21.7.1 build --profile release-candidate --platform "${{ inputs.platform }}" --non-interactive --wait
