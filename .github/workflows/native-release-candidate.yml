name: Build native release candidate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme à construire
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-release-candidate.yml

permissions:
  contents: write

jobs:
  standalone-android:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
      EXPO_PUBLIC_MOCK_MODE: "true"
      EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
      EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com
    steps:
      - name: Récupérer la release V23
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Vérifier token et projet EAS
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@21.7.1 whoami
          npx --yes eas-cli@21.7.1 project:info --json >/dev/null
      - name: Vérifier Connexio avant APK
        run: npm run verify && npm run audit:rc && npx expo install --check && npx expo config --type public >/dev/null
      - name: Construire le nouvel APK standalone avec EAS
        run: |
          npx --yes eas-cli@21.7.1 build \
            --profile standalone \
            --platform android \
            --non-interactive \
            --wait \
            --clear-cache \
            --json > eas-build-android.json
          cat eas-build-android.json
      - name: Enregistrer l'APK V23 dans la release
        run: |
          mkdir -p builds
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('eas-build-android.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : raw;
          if (!build?.id) throw new Error('Réponse EAS sans build id.');
          if (build.status !== 'FINISHED') throw new Error(`Build EAS non terminé: ${build.status}`);
          const artifactUrl = build.artifacts?.buildUrl || build.artifacts?.applicationArchiveUrl;
          if (!artifactUrl || !artifactUrl.endsWith('.apk')) throw new Error('APK EAS introuvable dans la réponse finale.');
          const out = {
            id: build.id,
            status: build.status,
            platform: build.platform,
            buildProfile: build.buildProfile || 'standalone',
            sdkVersion: build.sdkVersion || null,
            appVersion: build.appVersion || null,
            appBuildVersion: build.appBuildVersion || null,
            gitCommitHash: build.gitCommitHash || null,
            createdAt: build.createdAt || null,
            completedAt: build.completedAt || null,
            artifactUrl
          };
          fs.writeFileSync('builds/latest-android-standalone.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify(out, null, 2));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/latest-android-standalone.json
          git commit -m "build(android): record V23 standalone APK [skip ci]"
          git push origin HEAD:release/connexio-rc1

  eas-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
    steps:
      - name: Vérifier les accès EAS
        run: test -n "$EXPO_TOKEN" || { echo "Secret EXPO_TOKEN manquant"; exit 1; }
      - name: Récupérer la release candidate validée
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
      - name: Préparer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Vérifier la release candidate
        run: npm run verify && npm run audit:rc && npx expo install --check
      - name: Construire avec EAS
        run: npx eas-cli@21.7.1 build --profile release-candidate --platform "${{ inputs.platform }}" --non-interactive --wait
