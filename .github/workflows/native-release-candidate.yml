name: Probe Connexio Expo build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-release-candidate.yml

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: 1e85dc3a-4114-4387-8e15-2463a82e68fd
  EXPO_PUBLIC_MOCK_MODE: "true"
  EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
  EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Read EAS project and Android builds
        shell: bash
        run: |
          mkdir -p builds
          npx --yes eas-cli@21.7.1 whoami > builds/new-expo-probe.log 2>&1 || true
          npx --yes eas-cli@21.7.1 project:info --json >> builds/new-expo-probe.log 2>&1 || true
          set +e
          npx --yes eas-cli@21.7.1 build:list --platform android --limit 10 --json > builds/new-expo-build-list.json 2>> builds/new-expo-probe.log
          code=$?
          set -e
          echo "build_list_exit=$code" >> builds/new-expo-probe.log
          cat builds/new-expo-probe.log
          cat builds/new-expo-build-list.json || true
      - name: Publish probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/new-expo-probe.log builds/new-expo-build-list.json
          git commit -m "chore(expo): record new project build status [skip ci]" || true
          git push origin HEAD:release/connexio-rc1
