name: UX Round 2 Audit

on:
  push:
    branches:
      - fix/connexio-ux-round2-20260814

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy light-theme token report
        shell: bash
        run: |
          set +e
          echo '=== APP + NAVIGABLE COMPONENTS: LEGACY DARK TOKENS ==='
          grep -RIn --include='*.ts' --include='*.tsx' -E 'colors\.(background|surface|surfaceStrong|text|textMuted)|gradients\.screen|#020713|#050B1C|#081226|#0B1630|rgba\(2,[[:space:]]*7,[[:space:]]*19|rgba\(5,[[:space:]]*11,[[:space:]]*28' app src/components src/screens || true
          echo '=== NATIVE DIALOG / SCREEN GESTURE PRIMITIVES ==='
          grep -RIn --include='*.ts' --include='*.tsx' -E '(^|[^A-Za-z0-9_])Alert\.alert|ToastAndroid|ActionSheetIOS|SwipeTabShell|EdgeSwipeBack' app src || true
          echo '=== PRESSABLES WITHOUT OBVIOUS PRESS CALLBACK (heuristic) ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          for root in ('app','src/components','src/screens'):
              for p in Path(root).rglob('*.tsx'):
                  s=p.read_text(errors='ignore')
                  for m in re.finditer(r'<Pressable\b([^>]*)>',s,re.S):
                      attrs=m.group(1)
                      if 'onPress=' not in attrs and 'disabled' not in attrs:
                          line=s[:m.start()].count('\n')+1
                          print(f'{p}:{line}: Pressable without onPress in opening tag')
          PY
