name: V14 user fixes

on:
  push:
    branches:
      - feat/v14-ux-calls-moderation
    paths:
      - .github/workflows/v14-user-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v14-ux-calls-moderation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply corrections
        run: |
          python scripts/tmp_patch_reactions.py
          python scripts/tmp_patch_polls_voice.py
          python scripts/tmp_patch_calls.py

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build web preview
        run: npm run web:build

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v14-user-fixes.yml \
                 scripts/tmp_patch_reactions.py \
                 scripts/tmp_patch_polls_voice.py \
                 scripts/tmp_patch_calls.py
          git add src/components/MessageBubble.tsx \
                  src/services/api/wireExtensions.ts \
                  app/chat/[id].tsx \
                  src/components/InlineVoiceRecorder.tsx \
                  app/call/[id].tsx \
                  src/services/calls/callRoom.ts \
                  src/components/CallSurface.native.tsx
          git commit -m "fix: align reactions polls voice and call ringtone"
          git push origin HEAD:feat/v14-ux-calls-moderation
