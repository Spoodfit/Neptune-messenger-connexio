name: Sync safe area dependency

on:
  push:
    branches:
      - feat/production-hardening

permissions:
  contents: write

concurrency:
  group: sync-safe-area-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - name: Align dependency with Expo SDK 57
        run: npm install react-native-safe-area-context@~5.7.0 --save-exact --no-audit --no-fund
      - name: Commit synchronized manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix: align safe-area dependency with Expo SDK 57'
          git push origin HEAD:feat/production-hardening
