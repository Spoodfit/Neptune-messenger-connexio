name: RC lockfile refresh

on:
  pull_request:
    paths:
      - .github/workflows/rc-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Rebuild lockfile from scratch
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and Expo compatibility
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install --check
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/rc-lock-refresh.yml
          git add package-lock.json .github/workflows/rc-lock-refresh.yml
          git commit -m "chore(rc): lock Expo and worklets dependencies"
          git push origin HEAD:release/connexio-rc1
