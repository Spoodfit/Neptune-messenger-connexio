name: Manual deep branch validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connexio-manual-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EAS_BUILD_PROFILE: production
      EXPO_PUBLIC_EAS_PROJECT_ID: 1e85dc3a-4114-4387-8e15-2463a82e68fd
      EXPO_PUBLIC_MOCK_MODE: "false"
      EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
      EXPO_PUBLIC_API_BASE_URL: https://api.neptunebusiness.com/api
      EXPO_PUBLIC_REALTIME_URL: https://api.neptunebusiness.com
      EXPO_PUBLIC_COWORKING_ENABLED: "true"
      EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Vérifier le candidat de production
        run: npm run verify:rc
      - name: Générer le projet Android de production
        run: |
          npx expo prebuild --platform android --clean --no-install
          test -x android/gradlew
          test -f android/app/build.gradle
