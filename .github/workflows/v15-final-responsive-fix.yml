name: V15 final responsive fix

on:
  push:
    branches:
      - feat/v15-ux-navigation-calls
    paths:
      - .github/workflows/v15-final-responsive-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v15-ux-navigation-calls
      - name: Patch final responsive issues
        run: |
          python - <<'PY'
          from pathlib import Path

          calls = Path('app/(tabs)/calls.tsx')
          text = calls.read_text()
          old = '<ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={styles.frequentRow}>{frequent.map((member) => <View key={member.id} style={styles.frequentCard}><Pressable accessibilityLabel={`Profil de ${member.name}`} onPress={() => router.push(`/profile/${encodeURIComponent(member.id)}`)} style={styles.frequentIdentity}><StatusAvatar user={member} size={58} /><Text numberOfLines={1} style={styles.frequentName}>{member.name.split(" ")[0]}</Text><Text numberOfLines={1} style={styles.frequentCompany}>{member.company}</Text></Pressable><View style={styles.frequentActions}><Pressable accessibilityLabel={`Appeler ${member.name}`} onPress={() => void startCall(member.id, "audio")} style={styles.miniAction}><Ionicons name="call" size={18} color={colors.text} /></Pressable><Pressable accessibilityLabel={`Programmer avec ${member.name}`} onPress={() => scheduleWith(member.id)} style={styles.miniAction}><Ionicons name="calendar" size={18} color={colors.orange} /></Pressable></View></View>)}</ScrollView>'
          new = '<View style={styles.frequentRow}>{frequent.map((member) => <View key={member.id} style={styles.frequentCard}><Pressable accessibilityLabel={`Profil de ${member.name}`} onPress={() => router.push(`/profile/${encodeURIComponent(member.id)}`)} style={styles.frequentIdentity}><StatusAvatar user={member} size={58} /><Text numberOfLines={1} style={styles.frequentName}>{member.name.split(" ")[0]}</Text><Text numberOfLines={1} style={styles.frequentCompany}>{member.company}</Text></Pressable><View style={styles.frequentActions}><Pressable accessibilityLabel={`Appeler ${member.name}`} onPress={() => void startCall(member.id, "audio")} style={styles.miniAction}><Ionicons name="call" size={18} color={colors.text} /></Pressable><Pressable accessibilityLabel={`Programmer avec ${member.name}`} onPress={() => scheduleWith(member.id)} style={styles.miniAction}><Ionicons name="calendar" size={18} color={colors.orange} /></Pressable></View></View>)}</View>'
          if old not in text:
              raise SystemExit('Frequent calls block not found exactly')
          text = text.replace(old, new, 1)
          replacements = {
              'utilityText: { color: colors.textMuted, fontSize: 10, marginTop: 2 }': 'utilityText: { color: colors.textMuted, fontSize: 11, marginTop: 2 }',
              'frequentRow: { gap: 9, paddingVertical: 4, paddingRight: 10 }': 'frequentRow: { flexDirection: "row", flexWrap: "wrap", gap: 9, paddingVertical: 4 }',
              'frequentCard: { width: 136, minHeight: 174': 'frequentCard: { flexBasis: 122, flexGrow: 1, maxWidth: 160, minHeight: 174',
              'frequentCompany: { width: "100%", color: colors.textMuted, fontSize: 10': 'frequentCompany: { width: "100%", color: colors.textMuted, fontSize: 11',
              'statusText: { color: colors.orange, fontSize: 10': 'statusText: { color: colors.orange, fontSize: 11',
              'subjectLabel: { color: colors.orange, fontSize: 9': 'subjectLabel: { color: colors.orange, fontSize: 11',
              'guestLine: { color: colors.violet, fontSize: 10': 'guestLine: { color: colors.violet, fontSize: 11',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'Expected calls style not found: {before}')
              text = text.replace(before, after, 1)
          calls.write_text(text)

          tabbar = Path('src/components/NeptuneTabBar.tsx')
          text = tabbar.read_text()
          for before, after in {
              'quickMessage: { left: "50%", marginLeft: -142 }': 'quickMessage: { left: "50%", marginLeft: -130 }',
              'quickHighlight: { left: "50%", marginLeft: 10 }': 'quickHighlight: { left: "50%", marginLeft: -2 }',
          }.items():
              if before not in text:
                  raise SystemExit(f'Expected tab bar style not found: {before}')
              text = text.replace(before, after, 1)
          tabbar.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/calls.tsx' src/components/NeptuneTabBar.tsx
          git diff --cached --check
          git commit -m "fix: close final V15 responsive gaps"
          git push origin HEAD:feat/v15-ux-navigation-calls
