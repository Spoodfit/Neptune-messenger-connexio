name: Build native production binaries

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme Store à construire
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: connexio-native-production
  cancel-in-progress: false

jobs:
  production-build:
    name: production-${{ inputs.platform }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: 1e85dc3a-4114-4387-8e15-2463a82e68fd
      EXPO_PUBLIC_MOCK_MODE: "false"
      EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
      EXPO_PUBLIC_API_BASE_URL: https://api.neptunebusiness.com/api
      EXPO_PUBLIC_REALTIME_URL: https://api.neptunebusiness.com
      EXPO_PUBLIC_COWORKING_ENABLED: "true"
      EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com
    steps:
      - name: Checkout de la release exacte
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Verrouiller la provenance
        run: |
          set -euo pipefail
          echo "CONNEXIO_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git branch --show-current)" = "release/connexio-rc1"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Vérifier le token et le projet Expo
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@21.7.1 whoami
          npx eas-cli@21.7.1 project:info --json > eas-project-info.json
          node -e 'const p=require("./eas-project-info.json"); const id=p.id ?? p.projectId; if(id!==process.env.EXPO_PUBLIC_EAS_PROJECT_ID) throw new Error(`Projet EAS inattendu: ${id}`)'
      - name: Vérifier le candidat Store
        run: npm run verify:rc
      - name: Certifier le backend et ses dépendances critiques
        run: npm run smoke:production
      - name: Vérifier la configuration production embarquée
        env:
          EAS_BUILD_PROFILE: production
        run: npx expo config --type public >/dev/null
      - name: Construire les binaires Store signés
        run: npx eas-cli@21.7.1 build --profile production --platform "${{ inputs.platform }}" --non-interactive --wait
      - name: Résumé de provenance
        if: always()
        run: |
          echo "Source: $CONNEXIO_SOURCE_SHA"
          echo "Projet EAS: $EXPO_PUBLIC_EAS_PROJECT_ID"
          echo "Profil: production"

# La soumission App Store / Play Store reste une action séparée : un binaire
# ne doit jamais être publié automatiquement avant validation sur piste interne.
