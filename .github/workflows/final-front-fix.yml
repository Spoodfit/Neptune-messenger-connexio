name: Final Front Fix

on:
  push:
    branches:
      - feat/production-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(front-final)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact frontend corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "app/(tabs)/highlights.tsx": [
                  (
                      'item === "feed" ? "Afficher le Feed" : "Afficher la Map"',
                      'item === "feed" ? "Afficher le Feed" : "Afficher la carte"',
                  )
              ],
              "app/(tabs)/messages.tsx": [
                  (
                      '            <View style={styles.sheetHandle} />\n',
                      '''            <View style={styles.sheetHandle} />
            <Pressable
              accessibilityRole="button"
              accessibilityLabel="Fermer les options de conversation"
              onPress={closeMenu}
              style={({ pressed }) => ({
                position: "absolute",
                top: 8,
                right: 10,
                width: 44,
                height: 44,
                zIndex: 2,
                borderRadius: 22,
                alignItems: "center",
                justifyContent: "center",
                opacity: pressed ? 0.62 : 1
              })}
            >
              <Ionicons name="close" size={21} color={colors.textMuted} />
            </Pressable>
''',
                  )
              ],
              "scripts/product-audit.cjs": [
                  (
                      '        await page.keyboard.press("Escape");\n',
                      '''        const closeOptions = page.getByLabel("Fermer les options de conversation");
        await expectVisible(closeOptions, "fermeture du menu de conversation");
        if (await closeOptions.isVisible().catch(() => false)) {
          await closeOptions.click();
          await page.waitForTimeout(180);
        }
''',
                  )
              ],
          }

          changed = False
          for path, pairs in replacements.items():
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              for old, new in pairs:
                  if new in content:
                      continue
                  if content.count(old) != 1:
                      raise SystemExit(f"{path}: motif source introuvable ou ambigu")
                  content = content.replace(old, new, 1)
                  changed = True
              file.write_text(content, encoding="utf-8")

          if not changed:
              raise SystemExit("Aucune modification nécessaire")
          PY

          git config user.name "Connexio CI"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/(tabs)/highlights.tsx' 'app/(tabs)/messages.tsx' scripts/product-audit.cjs
          git commit -m "fix(front-final): fermer les options et harmoniser la carte"
          git push origin HEAD:feat/production-hardening
