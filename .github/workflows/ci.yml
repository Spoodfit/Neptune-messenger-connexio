name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: connexio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-native-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Generate package lock
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Validate Expo compatibility
        run: npx expo install --check
      - name: Restore immutable workflows
        run: python scripts/finalize_runtime_cleanup.py
      - name: Commit locked runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: verrouiller les dépendances Expo finales"
          git push origin HEAD:feat/production-hardening
