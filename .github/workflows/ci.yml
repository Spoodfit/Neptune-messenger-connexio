name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: connexio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Update locked dependencies
        run: npm install --no-audit --no-fund
      - name: Commit updated dependency lock
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): align Expo web renderer lock"
          git push origin HEAD:${{ github.head_ref }}
      - name: TypeScript and domain tests
        run: npm run verify --silent
      - name: Expo configuration audit
        run: npx expo config --type public >/dev/null
