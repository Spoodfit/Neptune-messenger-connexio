name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: connexio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-native-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Install Expo-compatible runtime dependencies
        run: npx expo install expo-image-picker expo-document-picker expo-location expo-video react-native-webview
      - name: Restore immutable workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          clean_ci = '''name: CI

on:
  pull_request:
