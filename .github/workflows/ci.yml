name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install dependencies
        run: npm install --silent --no-audit --no-fund
      - name: TypeScript
        run: |
          set -o pipefail
          npm run typecheck --silent 2>&1 | tee tsc-errors.log
      - name: Publish TypeScript diagnostics
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('tsc-errors.log')
              ? fs.readFileSync('tsc-errors.log', 'utf8').slice(0, 60000)
              : 'TypeScript failed without a captured log.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- connexio-ci-diagnostic -->\n### Diagnostic TypeScript\n\n\`\`\`text\n${output}\n\`\`\``
            });
