name: Finalize global status contours and action sounds

on:
  push:
    branches:
      - release/connexio-rc1
    paths:
      - .github/workflows/rc1-status-sounds-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connexio-rc1-status-sounds-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout RC1
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Restore validated correction bundle
        run: |
          cat scripts/bundle/part_* | base64 --decode > /tmp/connexio-status-sounds.tar.gz
          echo "ca6ab288f0a1f3fdcd4789dad6453bad12de20b150387e0c5c71428e2d0d5072  /tmp/connexio-status-sounds.tar.gz" | sha256sum --check
          tar -xzf /tmp/connexio-status-sounds.tar.gz
          rm -rf scripts/bundle
          python scripts/rc1_status_sounds_patch.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify TypeScript, domain tests and RC audit
        run: npm run verify:rc

      - name: Audit status contour coverage and sound mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          required_audio = [
              'assets/audio/connexio_call_end.mp3',
              'assets/audio/connexio_message_sent.mp3',
              'assets/audio/connexio_mention.mp3',
          ]
          for path in required_audio:
              item = Path(path)
              if not item.is_file() or item.stat().st_size < 1024:
                  raise SystemExit(f'Audio invalide: {path}')

          status_targets = [
              'app/(tabs)/calls.tsx',
              'app/(tabs)/contacts.tsx',
              'app/(tabs)/highlights.tsx',
              'app/(tabs)/settings.tsx',
              'app/account.tsx',
              'app/blocked-users.tsx',
              'app/call/[id].tsx',
              'app/chat/[id].tsx',
              'app/conversation/[id].tsx',
              'app/group/[id].tsx',
              'app/highlight/[id].tsx',
              'app/new-highlight.tsx',
              'src/components/ConversationRow.tsx',
              'src/components/HighlightCard.tsx',
              'src/components/MemberAvatarStack.tsx',
              'src/components/MessageBubble.tsx',
              'src/components/PollMessageCard.tsx',
              'src/screens/NewConversationScreen.tsx',
          ]
          for path in status_targets:
              text = Path(path).read_text(encoding='utf-8')
              if 'StatusAvatar' not in text and 'MemberAvatarStack' not in text:
                  raise SystemExit(f'Contouring de statut absent: {path}')

          for path in ['src/components/NeptuneMap.native.tsx', 'src/components/NeptuneMap.web.tsx']:
              text = Path(path).read_text(encoding='utf-8')
              for token in ['getRoleAppearance', 'roleColor', 'roleBackground', '--role-color']:
                  if token not in text:
                      raise SystemExit(f'Carte sans statut ({token}): {path}')

          action_sounds = Path('src/services/audio/actionSounds.ts').read_text(encoding='utf-8')
          provider = Path('src/providers/MessagingProvider.tsx').read_text(encoding='utf-8')
          call = Path('app/call/[id].tsx').read_text(encoding='utf-8')
          push = Path('src/services/notifications/pushNotifications.ts').read_text(encoding='utf-8')
          config = Path('app.config.ts').read_text(encoding='utf-8')
          if 'connexio_message_sent.mp3' not in action_sounds or 'playMessageSent' not in provider:
              raise SystemExit('Son de message envoyé non branché.')
          if 'connexio_call_end.mp3' not in action_sounds or 'playCallEnd' not in call:
              raise SystemExit('Son de fin d’appel non branché.')
          if 'connexio_mention.mp3' not in action_sounds or 'playMention' not in provider:
              raise SystemExit('Son de mention en temps réel non branché.')
          if 'connexio_mention.mp3' not in push or 'connexio_mention.mp3' not in config:
              raise SystemExit('Son de notification de mention non configuré.')
          if 'id: "replies"' not in push:
              raise SystemExit('Les réponses utilisent encore le canal de mention.')

          forbidden = [
              Path('scripts/rc1_status_sounds_patch.py'),
              Path('scripts/bundle'),
          ]
          for path in forbidden:
              if path.exists():
                  raise SystemExit(f'Ressource temporaire restante: {path}')
          PY

      - name: Build web test version
        env:
          EXPO_PUBLIC_MOCK_MODE: "true"
          EXPO_PUBLIC_GITHUB_PAGES: "true"
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.invalid/v1/realtime
          EXPO_PUBLIC_PRIVACY_POLICY_URL: https://neptunebusiness.com/confidentialite
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: https://neptunebusiness.com/suppression-compte
          EXPO_PUBLIC_SUPPORT_URL: https://neptunebusiness.com/contact
        run: npm run web:build

      - name: Validate release-candidate Expo configuration
        env:
          EAS_BUILD_PROFILE: release-candidate
          EXPO_PUBLIC_MOCK_MODE: "false"
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.invalid/v1/realtime
          EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com
          EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-0000-0000-000000000000
          EXPO_PUBLIC_PRIVACY_POLICY_URL: https://neptunebusiness.com/confidentialite
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: https://neptunebusiness.com/suppression-compte
          EXPO_PUBLIC_SUPPORT_URL: https://neptunebusiness.com/contact
        run: npx expo config --type public >/dev/null

      - name: Validate native projects and custom mention sound
        env:
          EAS_BUILD_PROFILE: release-candidate
          EXPO_PUBLIC_MOCK_MODE: "false"
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.invalid/v1/realtime
          EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com
          EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-0000-0000-000000000000
          EXPO_PUBLIC_PRIVACY_POLICY_URL: https://neptunebusiness.com/confidentialite
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: https://neptunebusiness.com/suppression-compte
          EXPO_PUBLIC_SUPPORT_URL: https://neptunebusiness.com/contact
        run: |
          cp package.json /tmp/connexio-package.json
          cp package-lock.json /tmp/connexio-package-lock.json
          npx expo prebuild --platform all --no-install --clean
          test -d ios
          test -d android
          test -f android/app/src/main/AndroidManifest.xml
          find android -type f -path '*res/raw/connexio_notification.*' -print -quit | grep -q .
          find android -type f -path '*res/raw/connexio_mention.*' -print -quit | grep -q .
          rm -rf ios android
          cp /tmp/connexio-package.json package.json
          cp /tmp/connexio-package-lock.json package-lock.json

      - name: Commit validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/rc1-status-sounds-finalize.yml
          if git diff --cached --quiet; then
            echo "Aucune correction applicative à enregistrer."
            exit 0
          fi
          git commit -m "fix: apply member status contours and contextual action sounds app-wide"
          git push origin HEAD:release/connexio-rc1
