name: Call Return Finalize

on:
  push:
    branches:
      - fix/connexio-ux-round2-20260814

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[call-return-finalize]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: python3 scripts/call-return-finalize.py
      - run: npm ci
      - run: npm run verify --silent
      - name: Commit call navigation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: return from calls to the source screen'
          git push origin HEAD:fix/connexio-ux-round2-20260814
