name: Theme Single Components Apply

on:
  push:
    branches:
      - fix/connexio-ux-round2-20260814

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[theme-finalize]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply semantic-theme migration
        run: python3 scripts/theme-single-components.py
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript and domain tests
        run: npm run verify --silent
      - name: Commit semantic-theme migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app src
          if git diff --cached --quiet; then
            echo 'No theme migration changes.'
            exit 0
          fi
          git commit -m 'fix: finish semantic light-theme migration'
          git push origin HEAD:fix/connexio-ux-round2-20260814
