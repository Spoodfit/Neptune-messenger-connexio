name: Fix messages viewport

on:
  push:
    branches:
      - feat/production-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Constrain the messages list viewport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/(tabs)/messages.tsx")
          content = path.read_text(encoding="utf-8")
          old = '  listViewport: { width: "100%", maxWidth: MAX_CONTENT_WIDTH, alignSelf: "center" },'
          new = '  listViewport: { flex: 1, minHeight: 0, width: "100%", maxWidth: MAX_CONTENT_WIDTH, alignSelf: "center" },'

          if new not in content:
              if content.count(old) != 1:
                  raise SystemExit("Le style listViewport attendu est absent ou ambigu.")
              path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit the correction and remove this temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-messages-viewport.yml
          git config user.name "Connexio CI"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/(tabs)/messages.tsx'
          git commit -m "fix(responsive): contraindre la liste des discussions"
          git push origin HEAD:feat/production-hardening
