name: Build standalone native apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme standalone à construire
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
  push:
    branches:
      - release/connexio-rc1
    paths:
      - .github/workflows/native-standalone.yml
      - app/**
      - src/**
      - assets/**
      - scripts/**
      - app.json
      - app.config.*
      - eas.json
      - package.json
      - package-lock.json
      - tsconfig.json

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
  EXPO_PUBLIC_MOCK_MODE: "true"
  EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
  EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com

jobs:
  standalone-android:
    name: standalone-android
    if: github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Vérifier les accès EAS
        run: test -n "$EXPO_TOKEN"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Aligner les dépendances Expo SDK 57
        run: |
          npx expo install expo-audio expo-linking --npm
          npx expo install --check
      - name: Enregistrer le lockfile Expo corrigé
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile Expo déjà aligné."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(expo): align SDK 57 dependencies [skip ci]"
          git push origin HEAD:release/connexio-rc1
      - name: Vérifier Connexio avant build
        run: npm run verify && npm run audit:rc && npx expo install --check
      - name: Normaliser les assets PNG Connexio
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path("assets")
          splash_path = assets / "splash-icon.png"
          icon_path = assets / "icon.png"
          adaptive_path = assets / "adaptive-icon.png"

          source = Image.open(splash_path)
          source.load()
          source = source.convert("RGBA")
          if source.size != (1024, 1024):
              source = source.resize((1024, 1024), Image.Resampling.LANCZOS)

          alpha_bbox = source.getchannel("A").getbbox()
          if not alpha_bbox:
              raise SystemExit("Le logo Connexio transparent est vide.")
          logo = source.crop(alpha_bbox)

          def fit_logo(max_side: int) -> Image.Image:
              width, height = logo.size
              scale = min(max_side / width, max_side / height)
              size = (max(1, round(width * scale)), max(1, round(height * scale)))
              return logo.resize(size, Image.Resampling.LANCZOS)

          source.save(splash_path, format="PNG", optimize=False, compress_level=6)

          adaptive_logo = fit_logo(460)
          adaptive = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          adaptive_pos = ((1024 - adaptive_logo.width) // 2, (1024 - adaptive_logo.height) // 2)
          adaptive.alpha_composite(adaptive_logo, adaptive_pos)
          adaptive.save(adaptive_path, format="PNG", optimize=False, compress_level=6)

          icon_logo = fit_logo(660)
          icon = Image.new("RGBA", (1024, 1024), (255, 255, 255, 255))
          icon_pos = ((1024 - icon_logo.width) // 2, (1024 - icon_logo.height) // 2)
          icon.alpha_composite(icon_logo, icon_pos)
          icon.convert("RGB").save(icon_path, format="PNG", optimize=False, compress_level=6)

          check_adaptive = Image.open(adaptive_path).convert("RGBA")
          bbox = check_adaptive.getchannel("A").getbbox()
          if not bbox:
              raise SystemExit("adaptive-icon.png est vide.")
          left, top, right, bottom = bbox
          width, height = right - left, bottom - top
          center_x, center_y = (left + right) / 2, (top + bottom) / 2
          if max(width, height) > 472:
              raise SystemExit(f"Foreground Android trop grand: {width}x{height}.")
          if abs(center_x - 512) > 4 or abs(center_y - 512) > 4:
              raise SystemExit(f"Foreground Android mal centré: centre=({center_x},{center_y}).")
          if icon_path.read_bytes() == adaptive_path.read_bytes():
              raise SystemExit("icon.png et adaptive-icon.png ne doivent jamais être identiques.")

          for path in (icon_path, adaptive_path, splash_path):
              check = Image.open(path)
              check.load()
              print(f"{path}: {check.mode} {check.size} {path.stat().st_size} bytes")
          print(f"adaptive visible bbox={bbox}, size={width}x{height}, center=({center_x:.1f},{center_y:.1f})")
          PY
      - name: Vérifier la configuration standalone
        run: npx expo config --type public >/dev/null
      - name: Reproduire le vrai Expo Prebuild Android
        env:
          EXPO_DEBUG: "1"
          EXPO_CONFIG_PLUGIN_VERBOSE_ERRORS: "1"
        run: |
          set -euxo pipefail
          rm -rf android
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee expo-prebuild-android.log
          test -x android/gradlew
          test -f android/app/build.gradle
          rm -rf android
      - name: Inspecter la phase Prebuild EAS Android
        env:
          EXPO_DEBUG: "1"
          EXPO_CONFIG_PLUGIN_VERBOSE_ERRORS: "1"
        run: |
          rm -rf .eas-prebuild
          npx eas-cli@21.7.1 build:inspect \
            --profile standalone \
            --platform android \
            --stage pre-build \
            --output .eas-prebuild \
            --force \
            --verbose
          rm -rf .eas-prebuild
      - name: Construire standalone Android avec EAS
        run: |
          npx eas-cli@21.7.1 build \
            --profile standalone \
            --platform android \
            --non-interactive \
            --wait \
            --clear-cache \
            --json > eas-build-android.json
          cat eas-build-android.json
      - name: Publier les métadonnées du nouvel APK
        run: |
          mkdir -p builds
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('eas-build-android.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : raw;
          if (!build || !build.id) throw new Error('Réponse EAS invalide: build introuvable.');
          const artifactUrl = build.artifacts?.buildUrl || build.artifacts?.applicationArchiveUrl || null;
          if (!artifactUrl) throw new Error('Build EAS terminé sans URL APK.');
          const metadata = {
            id: build.id,
            status: build.status,
            platform: build.platform,
            profile: 'standalone',
            gitCommit: process.env.GITHUB_SHA,
            appVersion: build.appVersion ?? null,
            appBuildVersion: build.appBuildVersion ?? null,
            createdAt: build.createdAt ?? null,
            completedAt: build.completedAt ?? null,
            artifactUrl
          };
          fs.writeFileSync('builds/latest-android-standalone.json', JSON.stringify(metadata, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT ?? '/dev/null', `artifact_url=${artifactUrl}\n`);
          console.log(JSON.stringify(metadata, null, 2));
          NODE
      - name: Enregistrer la référence du nouvel APK
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/latest-android-standalone.json
          if git diff --cached --quiet; then
            echo "Métadonnées APK inchangées."
            exit 0
          fi
          git commit -m "build(android): record latest standalone APK [skip ci]"
          git push origin HEAD:release/connexio-rc1

  standalone-ios:
    name: standalone-ios
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'ios' || inputs.platform == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Vérifier les accès EAS
        run: test -n "$EXPO_TOKEN"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Aligner les dépendances Expo SDK 57
        run: |
          npx expo install expo-audio expo-linking --npm
          npx expo install --check
      - name: Vérifier Connexio avant build
        run: npm run verify && npm run audit:rc && npx expo install --check
      - name: Vérifier la configuration standalone
        run: npx expo config --type public >/dev/null
      - name: Construire standalone iOS avec EAS
        run: |
          npx eas-cli@21.7.1 build \
            --profile standalone \
            --platform ios \
            --non-interactive \
            --wait \
            --clear-cache \
            --verbose-logs \
            --build-logger-level debug
