name: Build standalone native apps

on:
  workflow_dispatch:
  push:
    branches:
      - release/connexio-rc1
    paths:
      - .github/workflows/native-standalone.yml

permissions:
  contents: read

jobs:
  eas-build:
    name: standalone-${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - android
          - ios
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
      EXPO_PUBLIC_MOCK_MODE: "true"
      EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
      EXPO_PUBLIC_API_BASE_URL: ""
      EXPO_PUBLIC_REALTIME_URL: ""
      EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com
    steps:
      - name: Vérifier les accès EAS
        run: test -n "$EXPO_TOKEN"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund

      - name: Vérifier Connexio avant build
        run: npm run verify && npm run audit:rc && npx expo install --check

      - name: Vérifier la configuration standalone
        run: npx expo config --type public >/dev/null

      - name: Construire standalone avec EAS
        run: npx eas-cli@21.7.1 build --profile standalone --platform "${{ matrix.platform }}" --non-interactive --wait
