name: Apply Attachment Rendering

on:
  push:
    branches:
      - feat/production-hardening

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[attachment-rendering]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          fetch-depth: 0
      - run: python scripts/apply_attachment_rendering.py
      - run: rm scripts/apply_attachment_rendering.py .github/workflows/apply-attachment-rendering.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MessageBubble.tsx scripts/apply_attachment_rendering.py .github/workflows/apply-attachment-rendering.yml
          git commit -m "feat: afficher réellement les pièces jointes"
          git push origin HEAD:feat/production-hardening
