name: Extract UI strings

on:
  push:
    branches:
      - fix/connexio-light-i18n-20260815
    paths:
      - .github/workflows/extract-ui-strings.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/connexio-light-i18n-20260815
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Extract visible strings
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ts = require('typescript');
          const roots = ['app','src'];
          const files=[];
          function walk(dir){
            for(const name of fs.readdirSync(dir)){
              const p=path.join(dir,name); const s=fs.statSync(p);
              if(s.isDirectory()) walk(p); else if(/\.tsx?$/.test(name)) files.push(p);
            }
          }
          roots.forEach(r=>walk(r));
          const found = new Map();
          const attrNames = new Set(['title','subtitle','label','placeholder','message','confirmLabel','cancelLabel','accessibilityLabel','accessibilityHint','description']);
          function add(text,file,kind){
            const value=String(text).replace(/\s+/g,' ').trim();
            if(!value || value.length<2 || value.length>240) return;
            if(!/[A-Za-zÀ-ÿ]/.test(value)) return;
            if(/^[/@.#]|^[a-z0-9_-]+:\/\//i.test(value)) return;
            if(/^(ionicons|button|text|view|true|false|system|web|android|ios)$/i.test(value)) return;
            const key=value;
            if(!found.has(key)) found.set(key,[]);
            const a=found.get(key); if(a.length<4) a.push(`${file}:${kind}`);
          }
          for(const file of files){
            const source=fs.readFileSync(file,'utf8');
            const sf=ts.createSourceFile(file,source,ts.ScriptTarget.Latest,true,file.endsWith('.tsx')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
            function visit(node){
              if(ts.isJsxText(node)) add(node.text,file,'jsx');
              if(ts.isJsxAttribute(node) && attrNames.has(node.name.text)){
                if(node.initializer && ts.isStringLiteral(node.initializer)) add(node.initializer.text,file,`attr:${node.name.text}`);
                if(node.initializer && ts.isJsxExpression(node.initializer) && node.initializer.expression && ts.isStringLiteral(node.initializer.expression)) add(node.initializer.expression.text,file,`attr:${node.name.text}`);
              }
              if(ts.isCallExpression(node)){
                const callee=node.expression.getText(sf);
                if(/(?:AppAlert\.alert|alert|showAlert)$/.test(callee)){
                  for(const arg of node.arguments.slice(0,2)) if(ts.isStringLiteral(arg)||ts.isNoSubstitutionTemplateLiteral(arg)) add(arg.text,file,'alert');
                }
              }
              ts.forEachChild(node,visit);
            }
            visit(sf);
          }
          const out=[...found.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr')).map(([text,refs])=>`${text}\t${refs.join(' | ')}`).join('\n')+'\n';
          fs.mkdirSync('tmp',{recursive:true}); fs.writeFileSync('tmp/ui-strings.tsv',out);
          console.log(`Extracted ${found.size} UI strings`);
          NODE
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/ui-strings.tsv
          git commit -m 'chore: capture UI localization inventory'
          git push origin HEAD:fix/connexio-light-i18n-20260815
