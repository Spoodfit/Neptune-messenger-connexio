name: Expo current status probe

on:
  push:
    branches:
      - release/connexio-rc1
    paths:
      - .github/workflows/expo-current-status.yml

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: 1e85dc3a-4114-4387-8e15-2463a82e68fd

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Verify account and project
        run: |
          npx --yes eas-cli@21.7.1 whoami
          npx --yes eas-cli@21.7.1 project:info --json
      - name: Read current Android builds
        run: |
          mkdir -p builds
          npx --yes eas-cli@21.7.1 build:list --platform android --limit 10 --json --non-interactive > builds/eas-current-new-account.json
          cat builds/eas-current-new-account.json
      - name: Persist status snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/eas-current-new-account.json
          git commit -m "chore(expo): snapshot new-account Android builds [skip ci]" || true
          git push origin HEAD:release/connexio-rc1 || true
