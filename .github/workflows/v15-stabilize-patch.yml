name: V15 stabilization patch

on:
  push:
    branches:
      - feat/v15-ux-navigation-calls
    paths:
      - .github/workflows/v15-stabilize-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v15-ux-navigation-calls
      - name: Patch exact V15 audit findings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          calls = Path('app/(tabs)/calls.tsx')
          text = calls.read_text()
          patched, count = re.subn(r'(newAppointment\s*:\s*\{\s*minHeight\s*:\s*)38(\s*,)', r'\g<1>48\2', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Calls target patch, got {count}')
          calls.write_text(patched)

          audit = Path('scripts/visual-audit.cjs')
          text = audit.read_text()
          patched, count = re.subn(
              r'(name:\s*"Highlights 390"[\s\S]*?navigateLabel:\s*"Temps forts"[\s\S]*?)clickLabel:\s*"Afficher la carte"',
              r'\1clickText: "Map"',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'Expected one visual Map case patch, got {count}')
          text = patched
          old_runner = '''      if (testCase.clickLabel) {\n        await page.getByLabel(testCase.clickLabel).click();\n        await page.waitForTimeout(180);\n      }\n'''
          new_runner = '''      if (testCase.clickLabel) {\n        await page.getByLabel(testCase.clickLabel).click();\n        await page.waitForTimeout(180);\n      }\n      if (testCase.clickText) {\n        await page.getByText(testCase.clickText, { exact: true }).click();\n        await page.waitForTimeout(180);\n      }\n'''
          if old_runner not in text:
              raise SystemExit('Visual audit click runner not found')
          audit.write_text(text.replace(old_runner, new_runner, 1))
          PY
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/calls.tsx' scripts/visual-audit.cjs
          git commit -m "fix: stabilize V15 browser audits"
          git push origin HEAD:feat/v15-ux-navigation-calls
