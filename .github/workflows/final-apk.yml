name: Final V23 Android APK

on:
  pull_request:
    branches:
      - release/connexio-rc1
    paths:
      - .github/final-apk-trigger.txt

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
  EXPO_PUBLIC_MOCK_MODE: "true"
  EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
  EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com

jobs:
  final-apk:
    name: final-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Expo access
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@21.7.1 whoami
          npx --yes eas-cli@21.7.1 project:info --json
      - name: Validate release
        run: npm run verify && npm run audit:rc && npx expo install --check && npx expo config --type public >/dev/null
      - name: Build final standalone APK
        run: |
          npx --yes eas-cli@21.7.1 build \
            --profile standalone \
            --platform android \
            --non-interactive \
            --wait \
            --clear-cache \
            --json > eas-build-android.json
          cat eas-build-android.json
      - name: Validate APK response
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('eas-build-android.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : raw;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (!build?.id || build.status !== 'FINISHED' || !url?.endsWith('.apk')) throw new Error('EAS did not return a finished APK.');
          const out = {
            id: build.id,
            status: build.status,
            platform: build.platform,
            buildProfile: build.buildProfile || 'standalone',
            sdkVersion: build.sdkVersion || null,
            appVersion: build.appVersion || null,
            appBuildVersion: build.appBuildVersion || null,
            gitCommitHash: build.gitCommitHash || null,
            createdAt: build.createdAt || null,
            completedAt: build.completedAt || null,
            artifactUrl: url
          };
          fs.writeFileSync('final-apk.json', JSON.stringify(out, null, 2) + '\n');
          console.log('FINAL_APK=' + url);
          console.log(JSON.stringify(out, null, 2));
          NODE
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: connexio-v23-final-apk
          path: final-apk.json
          retention-days: 14
