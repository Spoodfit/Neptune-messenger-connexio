name: Final V23 Android APK

on:
  pull_request:
    branches:
      - release/connexio-rc1
    paths:
      - .github/final-apk-trigger.txt

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
  EXPO_PUBLIC_MOCK_MODE: "true"
  EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
  EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com

jobs:
  final-apk:
    name: final-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Expo dependency alignment
        run: |
          npx expo install --check
          npx --yes expo-doctor@latest
      - name: Regenerate invalid app icons from canonical splash
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path('assets')
          source_path = assets / 'splash-icon.png'
          source = Image.open(source_path)
          source.load()
          source = source.convert('RGBA')
          if source.size != (1024, 1024):
              raise SystemExit(f'Canonical splash must be 1024x1024, got {source.size}.')

          for name in ('icon.png', 'adaptive-icon.png'):
              target = assets / name
              source.save(target, format='PNG', optimize=False, compress_level=6)

          for name in ('icon.png', 'adaptive-icon.png', 'splash-icon.png', 'notification-icon.png'):
              path = assets / name
              image = Image.open(path)
              image.load()
              if image.format != 'PNG':
                  raise SystemExit(f'{path} is not PNG.')
              print(f'{path}: {image.mode} {image.size} {path.stat().st_size} bytes')
          PY
      - name: Persist repaired native assets
        run: |
          if git diff --quiet -- assets/icon.png assets/adaptive-icon.png; then
            echo "Native icons already healthy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png assets/adaptive-icon.png
          git commit -m "fix(assets): replace invalid PNG app icons [skip ci]"
          git push origin HEAD:release/connexio-rc1
      - name: Verify Expo access and Android toolchain
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@22.2.0 whoami
          npx --yes eas-cli@22.2.0 project:info --json
          test -n "$ANDROID_SDK_ROOT"
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "$ANDROID_SDK_ROOT/ndk" | tail -n 5 || true
      - name: Validate release
        run: npm run verify && npm run audit:rc && npx expo install --check && npx --yes expo-doctor@latest && npx expo config --type public >/dev/null
      - name: Build final standalone APK locally with EAS
        env:
          NODE_ENV: production
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-eas-artifacts
        run: |
          rm -rf local-eas-artifacts Connexio-V23.apk Connexio-V23.apk.sha256
          mkdir -p local-eas-artifacts
          npx --yes eas-cli@22.2.0 build \
            --profile standalone \
            --platform android \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/Connexio-V23.apk"
          test -s Connexio-V23.apk
          file Connexio-V23.apk
          sha256sum Connexio-V23.apk | tee Connexio-V23.apk.sha256
      - name: Validate APK archive and signature
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path('Connexio-V23.apk')
          if not apk.exists() or apk.stat().st_size < 1_000_000:
              raise SystemExit('APK absent ou anormalement petit.')
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              if 'AndroidManifest.xml' not in names:
                  raise SystemExit('AndroidManifest.xml absent de l APK.')
              if not any(name.startswith('classes') and name.endswith('.dex') for name in names):
                  raise SystemExit('Aucun classes*.dex dans l APK.')
          print(f'APK archive valide: {apk.stat().st_size} bytes')
          PY
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs Connexio-V23.apk
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: connexio-v23-final-apk
          path: |
            Connexio-V23.apk
            Connexio-V23.apk.sha256
          if-no-files-found: error
          retention-days: 14
