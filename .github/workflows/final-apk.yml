name: Final V23 Android APK

on:
  pull_request:
    branches:
      - release/connexio-rc1
    paths:
      - .github/final-apk-trigger.txt

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb
  EXPO_PUBLIC_MOCK_MODE: "true"
  EXPO_PUBLIC_BACKEND_CONTRACT: connexio-v1
  EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://neptunebusiness.com

jobs:
  final-apk:
    name: final-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Align native Expo peer dependencies
        run: |
          npx expo install expo-font expo-asset expo-constants --npm
          npx expo install --check
          npx --yes expo-doctor@latest
      - name: Persist SDK 57 dependency alignment
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Expo dependencies already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(expo): install required SDK 57 native peers [skip ci]"
          git push origin HEAD:release/connexio-rc1
      - name: Normalize PNG assets for Expo prebuild
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for name in ('icon.png', 'adaptive-icon.png', 'splash-icon.png', 'notification-icon.png', 'favicon.png'):
              path = Path('assets') / name
              if not path.exists():
                  continue
              image = Image.open(path)
              image.load()
              if image.mode not in ('RGB', 'RGBA'):
                  image = image.convert('RGBA')
              image.save(path, format='PNG', optimize=False, compress_level=6)
              check = Image.open(path)
              check.load()
              print(f'{path}: {check.mode} {check.size} {path.stat().st_size} bytes')
          PY
      - name: Verify Expo access and Android toolchain
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@22.2.0 whoami
          npx --yes eas-cli@22.2.0 project:info --json
          test -n "$ANDROID_SDK_ROOT"
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "$ANDROID_SDK_ROOT/ndk" | tail -n 5 || true
      - name: Validate release
        run: npm run verify && npm run audit:rc && npx expo install --check && npx --yes expo-doctor@latest && npx expo config --type public >/dev/null
      - name: Build final standalone APK locally with EAS
        env:
          NODE_ENV: production
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/local-eas-artifacts
        run: |
          rm -rf local-eas-artifacts Connexio-V23.apk Connexio-V23.apk.sha256
          mkdir -p local-eas-artifacts
          npx --yes eas-cli@22.2.0 build \
            --profile standalone \
            --platform android \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/Connexio-V23.apk"
          test -s Connexio-V23.apk
          file Connexio-V23.apk
          sha256sum Connexio-V23.apk | tee Connexio-V23.apk.sha256
      - name: Validate APK archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path('Connexio-V23.apk')
          if not apk.exists() or apk.stat().st_size < 1_000_000:
              raise SystemExit('APK absent ou anormalement petit.')
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              if 'AndroidManifest.xml' not in names:
                  raise SystemExit('AndroidManifest.xml absent de l APK.')
              if not any(name.startswith('classes') and name.endswith('.dex') for name in names):
                  raise SystemExit('Aucun classes*.dex dans l APK.')
          print(f'APK valide: {apk.stat().st_size} bytes')
          PY
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: connexio-v23-final-apk
          path: |
            Connexio-V23.apk
            Connexio-V23.apk.sha256
          if-no-files-found: error
          retention-days: 14
