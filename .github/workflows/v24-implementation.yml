name: Apply remaining Connexio V24 UX patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-v24:
    if: github.head_ref == 'fix/v24-messaging-coworking-map' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V24 branch
        uses: actions/checkout@v4
        with:
          ref: fix/v24-messaging-coworking-map
          fetch-depth: 0

      - name: Apply remaining messaging fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Marker not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              'src/screens/ChatConversationScreen.tsx',
              '  const messageListRef = useRef<FlatList<ChatMessage>>(null);\n',
              '  const messageListRef = useRef<FlatList<ChatMessage>>(null);\n  const lastLatestMessageIdRef = useRef<string | null>(null);\n'
          )
          replace(
              'src/screens/ChatConversationScreen.tsx',
              '  useEffect(() => {\n    if (!focusMention && !requestedFocusMessageId) return;\n',
              '''  useEffect(() => {
    const latest = messages[0];
    const previousLatestId = lastLatestMessageIdRef.current;
    lastLatestMessageIdRef.current = latest?.id ?? null;
    if (!latest?.isMine || previousLatestId === null || previousLatestId === latest.id) return;
    requestAnimationFrame(() => {
      messageListRef.current?.scrollToOffset({ offset: 0, animated: true });
    });
  }, [messages]);

  useEffect(() => {
    if (!focusMention && !requestedFocusMessageId) return;
'''
          )
          replace(
              'src/screens/ChatConversationScreen.tsx',
              '          maintainVisibleContentPosition={{ minIndexForVisible: 0 }}\n',
              '          maintainVisibleContentPosition={{ minIndexForVisible: 0, autoscrollToTopThreshold: 72 }}\n'
          )

          replace(
              'src/screens/MessagesScreenV22.tsx',
              'import { useMemo, useState } from "react";\nimport { ActivityIndicator, FlatList, Modal, Pressable, SectionList, StyleSheet, View } from "react-native";\n',
              'import { useEffect, useMemo, useRef, useState } from "react";\nimport { ActivityIndicator, Animated, FlatList, Modal, Pressable, SectionList, StyleSheet, View } from "react-native";\n'
          )
          replace('src/screens/MessagesScreenV22.tsx', '  isAnnouncementCollapsed,\n', '')
          replace(
              'src/screens/MessagesScreenV22.tsx',
              'type GroupSection = { key: ConversationSectionKey; title: string; data: Conversation[] };\n',
              'type GroupSection = { key: ConversationSectionKey; title: string; data: Conversation[]; unreadCount: number };\n'
          )
          replace(
              'src/screens/MessagesScreenV22.tsx',
              '  const { serviceAvailable, visibleConversations, getMessages, refreshConversations, loadingConversations, lastError } = useMessaging();\n',
              '  const { serviceAvailable, visibleConversations, getMessages, refreshConversations, markConversationRead, loadingConversations, lastError } = useMessaging();\n'
          )
          replace(
              'src/screens/MessagesScreenV22.tsx',
              '  const [collapsedSections, setCollapsedSections] = useState<Set<ConversationSectionKey>>(new Set());\n',
              '  const [collapsedSections, setCollapsedSections] = useState<Set<ConversationSectionKey>>(new Set());\n  const [acknowledgedAnnouncementVersion, setAcknowledgedAnnouncementVersion] = useState<string | null>(null);\n  const announcementPulse = useRef(new Animated.Value(0)).current;\n'
          )
          replace(
              'src/screens/MessagesScreenV22.tsx',
              '''    const sections: GroupSection[] = [
      { key: "pinned", title: GROUP_SECTION_LABELS.pinned, data: pinned },
      { key: "clubs", title: GROUP_SECTION_LABELS.clubs, data: section("clubs") },
      { key: "management", title: GROUP_SECTION_LABELS.management, data: section("management") },
      { key: "general", title: GROUP_SECTION_LABELS.general, data: section("general") }
    ];
''',
              '''    const makeSection = (key: ConversationSectionKey, title: string, data: Conversation[]): GroupSection => ({
      key,
      title,
      data,
      unreadCount: data.reduce((total, conversation) => total + Math.max(0, conversation.unreadCount ?? 0), 0)
    });
    const sections: GroupSection[] = [
      makeSection("pinned", GROUP_SECTION_LABELS.pinned, pinned),
      makeSection("clubs", GROUP_SECTION_LABELS.clubs, section("clubs")),
      makeSection("management", GROUP_SECTION_LABELS.management, section("management")),
      makeSection("general", GROUP_SECTION_LABELS.general, section("general"))
    ];
'''
          )
          replace(
              'src/screens/MessagesScreenV22.tsx',
              '''  const visibleGroupCount = useMemo(
    () => allConversations.filter((conversation) => !isPrivateConversationKind(conversation)).length,
    [allConversations]
  );

  const closeMenu = () => setSelectedConversation(null);
''',
              '''  const announcementVersion = announcement
    ? `${announcement.id}:${announcement.lastMessageAt ?? announcement.lastMessage ?? "empty"}`
    : null;
  const announcementUnread = Boolean(
    announcement &&
      ((announcement.unreadCount ?? 0) > 0 || (announcement.mentionCount ?? 0) > 0) &&
      acknowledgedAnnouncementVersion !== announcementVersion
  );

  useEffect(() => {
    if (!announcementUnread) {
      announcementPulse.stopAnimation();
      announcementPulse.setValue(0);
      return;
    }
    const animation = Animated.loop(
      Animated.sequence([
        Animated.timing(announcementPulse, { toValue: 1, duration: 1050, useNativeDriver: true, isInteraction: false }),
        Animated.timing(announcementPulse, { toValue: 0, duration: 1050, useNativeDriver: true, isInteraction: false })
      ])
    );
    animation.start();
    return () => animation.stop();
  }, [announcementPulse, announcementUnread]);

  const acknowledgeAnnouncement = async () => {
    if (!announcement) return;
    setAcknowledgedAnnouncementVersion(announcementVersion);
    await markConversationRead(announcement.id);
  };

  const openAnnouncement = async () => {
    if (!announcement) return;
    await acknowledgeAnnouncement();
    await openConversation(announcement);
  };

  const closeMenu = () => setSelectedConversation(null);
'''
          )
          replace(
              'src/screens/MessagesScreenV22.tsx',
              '<View style={[styles.sectionCount, { backgroundColor: theme.surfaceStrong }]}><Text style={[styles.sectionCountText, { color: theme.pageTextMuted }]}>{section.data.length}</Text></View>',
              '{section.unreadCount > 0 ? <View style={[styles.sectionCount, { backgroundColor: theme.violet }]}><Text style={[styles.sectionCountText, { color: "#FFFFFF" }]}>{section.unreadCount > 99 ? "99+" : section.unreadCount}</Text></View> : null}'
          )

          old_announcement = '''          ListHeaderComponent={announcement && conversationMatchesQuery(announcement, query) ? (
            <View style={styles.announcementWrap}>
              {isAnnouncementCollapsed(announcement) ? (
                <Pressable accessibilityRole="button" accessibilityLabel="Ouvrir Annonce" onPress={() => void openConversation(announcement)} onLongPress={() => setSelectedConversation(announcement)} style={[styles.announcementCollapsed, { borderColor: theme.borderSoft, backgroundColor: theme.surface }]}>
                  <View style={[styles.announcementIcon, { backgroundColor: theme.violetSoft }]}><Ionicons name="megaphone" size={19} color={theme.violet} /></View>
                  <View style={styles.announcementCopy}><Text style={[styles.announcementTitle, { color: theme.pageText }]}>Annonce</Text><Text numberOfLines={1} style={[styles.announcementPreview, { color: theme.pageTextMuted }]}>{announcement.lastMessage ?? "Consulter les annonces Neptune"}</Text></View>
                  <Ionicons name="chevron-forward" size={18} color={theme.pageTextMuted} />
                </Pressable>
              ) : renderConversation(announcement, true)}
            </View>
          ) : null}
'''
          new_announcement = '''          ListHeaderComponent={announcement && conversationMatchesQuery(announcement, query) ? (
            <View style={styles.announcementWrap}>
              <Animated.View style={[styles.announcementGlowShell, announcementUnread && {
                opacity: announcementPulse.interpolate({ inputRange: [0, 1], outputRange: [0.78, 1] })
              }]}>
                <LinearGradient
                  colors={announcementUnread ? [theme.violet, theme.orange, theme.violet] : [theme.borderSoft, theme.borderSoft, theme.borderSoft]}
                  start={{ x: 0, y: 0 }}
                  end={{ x: 1, y: 1 }}
                  style={styles.announcementBorder}
                >
                  <Pressable
                    accessibilityRole="button"
                    accessibilityLabel={announcementUnread ? "Nouvelle annonce non lue" : "Ouvrir Annonce"}
                    onPress={() => void openAnnouncement()}
                    onLongPress={() => setSelectedConversation(announcement)}
                    style={[styles.announcementCard, { backgroundColor: theme.surface }]}
                  >
                    <View style={styles.announcementHeaderLine}>
                      <View style={[styles.announcementIcon, { backgroundColor: announcementUnread ? theme.violetSoft : theme.surfaceStrong }]}><Ionicons name="megaphone" size={18} color={theme.violet} /></View>
                      <View style={styles.announcementCopy}>
                        <View style={styles.announcementTitleLine}>
                          <Text style={[styles.announcementTitle, { color: theme.pageText }]}>Annonce</Text>
                          {announcementUnread ? <View style={[styles.announcementUnreadPill, { backgroundColor: theme.violetSoft }]}><Text style={[styles.announcementUnreadText, { color: theme.violet }]}>NOUVEAU</Text></View> : null}
                        </View>
                        {!announcementUnread ? <Text numberOfLines={1} style={[styles.announcementPreview, { color: theme.pageTextMuted }]}>{announcement.lastMessage ?? "Consulter les annonces Neptune"}</Text> : null}
                      </View>
                      {!announcementUnread ? <Ionicons name="chevron-forward" size={18} color={theme.pageTextMuted} /> : null}
                    </View>
                    {announcementUnread ? (
                      <>
                        <Text style={[styles.announcementFullText, { color: theme.pageText }]}>{announcement.lastMessage ?? "Nouvelle annonce Neptune"}</Text>
                        <View style={styles.announcementActions}>
                          <Pressable
                            accessibilityRole="button"
                            accessibilityLabel="Marquer l'annonce comme lue"
                            onPress={(event) => { event.stopPropagation(); void acknowledgeAnnouncement(); }}
                            style={[styles.announcementReadButton, { backgroundColor: theme.surfaceStrong, borderColor: theme.borderSoft }]}
                          >
                            <Ionicons name="checkmark-done" size={17} color={theme.violet} />
                            <Text style={[styles.announcementReadText, { color: theme.pageText }]}>J’ai lu</Text>
                          </Pressable>
                          <View style={styles.announcementOpenHint}><Text style={[styles.announcementOpenText, { color: theme.pageTextMuted }]}>Ouvrir le groupe</Text><Ionicons name="arrow-forward" size={15} color={theme.pageTextMuted} /></View>
                        </View>
                      </>
                    ) : null}
                  </Pressable>
                </LinearGradient>
              </Animated.View>
            </View>
          ) : null}
'''
          replace('src/screens/MessagesScreenV22.tsx', old_announcement, new_announcement)
          replace(
              'src/screens/MessagesScreenV22.tsx',
              '          ListFooterComponent={<Text style={[styles.footerCount, { color: theme.pageTextMuted }]}>{visibleGroupCount} groupe{visibleGroupCount > 1 ? "s" : ""} visible{visibleGroupCount > 1 ? "s" : ""}</Text>}\n',
              ''
          )
          replace(
              'src/screens/MessagesScreenV22.tsx',
              '''  announcementWrap: { paddingTop: 8, paddingBottom: 3 },
  announcementCollapsed: { minHeight: 58, borderRadius: 18, borderWidth: 1, paddingHorizontal: 10, flexDirection: "row", alignItems: "center", gap: 10 },
  announcementIcon: { width: 40, height: 40, borderRadius: 13, alignItems: "center", justifyContent: "center" },
  announcementCopy: { flex: 1, minWidth: 0 },
  announcementTitle: { fontSize: 14, fontWeight: "900" },
  announcementPreview: { marginTop: 2, fontSize: 14, lineHeight: 18 },
''',
              '''  announcementWrap: { paddingTop: 8, paddingBottom: 5 },
  announcementGlowShell: { width: "100%", borderRadius: 20 },
  announcementBorder: { width: "100%", padding: 1.5, borderRadius: 20 },
  announcementCard: { minHeight: 58, borderRadius: 18.5, paddingHorizontal: 10, paddingVertical: 9, gap: 9 },
  announcementHeaderLine: { minHeight: 40, flexDirection: "row", alignItems: "center", gap: 10 },
  announcementIcon: { width: 40, height: 40, borderRadius: 13, alignItems: "center", justifyContent: "center", flexShrink: 0 },
  announcementCopy: { flex: 1, minWidth: 0 },
  announcementTitleLine: { flexDirection: "row", alignItems: "center", gap: 7 },
  announcementTitle: { fontSize: 14, fontWeight: "900" },
  announcementUnreadPill: { minHeight: 20, borderRadius: 999, paddingHorizontal: 7, alignItems: "center", justifyContent: "center" },
  announcementUnreadText: { fontSize: 9, lineHeight: 11, fontWeight: "900", letterSpacing: 0.7 },
  announcementPreview: { marginTop: 2, fontSize: 14, lineHeight: 18 },
  announcementFullText: { fontSize: 14, lineHeight: 20, fontWeight: "700", paddingHorizontal: 2 },
  announcementActions: { minHeight: 48, flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: 8 },
  announcementReadButton: { minHeight: 44, borderRadius: 14, borderWidth: 1, paddingHorizontal: 12, flexDirection: "row", alignItems: "center", gap: 7 },
  announcementReadText: { fontSize: 12, fontWeight: "900" },
  announcementOpenHint: { minHeight: 44, flexDirection: "row", alignItems: "center", gap: 5, paddingHorizontal: 4 },
  announcementOpenText: { fontSize: 11, fontWeight: "800" },
'''
          )
          replace('src/screens/MessagesScreenV22.tsx', '  footerCount: { textAlign: "center", fontSize: 12, paddingVertical: 10 },\n', '')
          PY

      - name: Commit patch to V24
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/ChatConversationScreen.tsx src/screens/MessagesScreenV22.tsx
          git commit -m "fix(v24): finalize message follow and announcement UX"
          git push origin HEAD:fix/v24-messaging-coworking-map
