          # Backend implementation notes for asynchronous transcription + map observer media.
          Path('docs/V24_MESSAGING_COWORKING_BACKEND.md').write_text(r'''# Connexio V24 — contrat backend complémentaire

## Messages vocaux

Le client envoie un attachment `kind: audio` avec `duration_seconds` et `transcript_status: pending`.
Le backend doit déclencher une transcription asynchrone après `/v1/uploads/:id/complete` ou après création du message.

Le message retourné et les évènements temps réel doivent exposer :

```json
{
  "kind": "audio",
  "download_url": "https://…",
  "duration_seconds": 18.4,
  "transcript": "Texte transcrit…",
  "transcript_status": "ready"
}
```

Valeurs de `transcript_status`: `pending`, `ready`, `failed`.
La transcription ne remplace jamais l'audio original. Elle est traduisible via `transcript_translation` comme le reste du contenu Connexio.

## Coworking Map

`GET /v1/coworking` peut fournir pour chaque présence `map_x` et `map_y` (pourcentages 0–100 du plan numérique). Sans coordonnées, le client applique un placement déterministe.

Pour afficher les caméras directement dans la map sans faire entrer automatiquement l'utilisateur dans une salle, le snapshot peut fournir un token SFU **observer/listen-only** :

```json
{
  "observer_media": {
    "space_id": "coworking-map",
    "socket_url": "https://…",
    "socket_path": "/socket.io",
    "client_script_url": "https://…/coworking-client.js",
    "token": "short-lived-token",
    "participant_id": "viewer-user-id",
    "ice_servers": [],
    "observer": true,
    "expires_at": "…"
  }
}
```

Le client observer ne demande ni caméra ni microphone. Il reçoit uniquement les flux vidéo autorisés des membres dont `camera_on = true`. Le SDK SFU doit accepter `observer: true` et `localStream: null`.

La map reste utilisable sans `observer_media`: présence, avatar, disponibilité et espaces fonctionnent; seule la miniature vidéo live retombe sur l'avatar.
''')

