import { Ionicons } from "@expo/vector-icons";
import { LinearGradient } from "expo-linear-gradient";
import { router } from "expo-router";
import { useMemo, useState } from "react";
import { Image, Pressable, ScrollView, StyleSheet, View } from "react-native";
import { useSafeAreaInsets } from "react-native-safe-area-context";

import CoworkingMediaSurface from "../components/CoworkingMediaSurface";
import { StatusAvatar } from "../components/StatusAvatar";
import { useCoworking } from "../providers/CoworkingProvider";
import { useExperience } from "../providers/ExperienceProvider";
import { useMessaging } from "../providers/MessagingProvider";
import { useSession } from "../providers/SessionProvider";
import { useAppTheme } from "../providers/ThemeProvider";
import { colors, gradients, spacing } from "../theme";
import type { CoworkingParticipantPresence, CoworkingPresenceMode, CoworkingSpace } from "../types/coworking";

const FALLBACK_POSITIONS = [
  [18, 22], [42, 18], [70, 25], [83, 48], [27, 54], [58, 60], [77, 76], [36, 82], [62, 40], [15, 72], [88, 20]
] as const;

const PRESENCE_META: Record<CoworkingPresenceMode, { label: string; icon: keyof typeof Ionicons.glyphMap; tone: string }> = {
  available: { label: "Disponible", icon: "chatbubble-ellipses-outline", tone: "#36D48A" },
  focus: { label: "Focus", icon: "headset-outline", tone: "#8D7BFF" },
  break: { label: "En pause", icon: "cafe-outline", tone: "#F2A64B" },
  talk: { label: "En échange", icon: "people-outline", tone: "#50B5FF" }
};

function spaceForParticipant(userId: string, hub: CoworkingSpace, spaces: CoworkingSpace[]): CoworkingSpace | undefined {
  if (hub.participantIds.includes(userId)) return hub;
  return spaces.find((space) => space.participantIds.includes(userId));
}

export default function CoworkingMapScreen() {
  const insets = useSafeAreaInsets();
  const theme = useAppTheme();
  const { currentUser } = useSession();
  const { members, localConversations } = useExperience();
  const { visibleConversations } = useMessaging();
  const { serviceAvailable, snapshot, activeCount, currentSpace, loading, error, joinSpace, leaveCurrentSpace, updatePresence, mediaForSpace } = useCoworking();
  const [selectedUserId, setSelectedUserId] = useState<string | null>(null);
  const [joining, setJoining] = useState(false);
  const [mediaError, setMediaError] = useState<string | null>(null);

  const participants = useMemo(() => snapshot.participants.filter((participant) => participant.userId !== currentUser.id), [currentUser.id, snapshot.participants]);
  const currentPresence = snapshot.participants.find((participant) => participant.userId === currentUser.id);
  const mediaSession = snapshot.observerMedia ?? (currentSpace ? mediaForSpace(currentSpace.id) : undefined);
  const selectedPresence = participants.find((participant) => participant.userId === selectedUserId);
  const selectedMember = members.find((member) => member.id === selectedUserId);
  const selectedSpace = selectedUserId ? spaceForParticipant(selectedUserId, snapshot.hub, snapshot.spaces) : undefined;

  const layout = useMemo(() => Object.fromEntries(participants.map((participant, index) => {
    const fallback = FALLBACK_POSITIONS[index % FALLBACK_POSITIONS.length] ?? [50, 50];
    const x = participant.mapX ?? fallback[0];
    const y = participant.mapY ?? fallback[1];
    const camera = participant.cameraOn;
    return [participant.userId, { x, y, width: camera ? 112 : 76, height: camera ? 122 : 76 }];
  })), [participants]);

  const findDirectConversation = (userId: string) => [...visibleConversations, ...localConversations].find((conversation) => {
    if (conversation.type !== "direct") return false;
    const ids = conversation.memberIds ?? [];
    return ids.includes(currentUser.id) && ids.includes(userId);
  });

  const sayHello = () => {
    if (!selectedMember) return;
    const conversation = findDirectConversation(selectedMember.id);
    if (conversation) {
      router.push({ pathname: "/chat/[id]", params: { id: conversation.id, draft: "Bonjour 👋" } });
    } else {
      router.push({ pathname: "/new-conversation", params: { memberId: selectedMember.id, prefill: "Bonjour 👋" } });
    }
    setSelectedUserId(null);
  };

  const joinSelected = async () => {
    if (!selectedSpace || joining) return;
    setJoining(true);
    try {
      if (currentSpace?.id !== selectedSpace.id) await joinSpace(selectedSpace.id);
      setSelectedUserId(null);
      router.push(`/coworking/${encodeURIComponent(selectedSpace.id)}`);
    } finally {
      setJoining(false);
    }
  };

  const joinHub = async () => {
    if (joining) return;
    setJoining(true);
    try {
      await joinSpace(snapshot.hub.id);
    } finally {
      setJoining(false);
    }
  };

  if (!serviceAvailable) {
    return <View style={[styles.unavailable, { backgroundColor: theme.pageBackground }]}><Ionicons name="people-circle-outline" size={42} color={theme.violet} /><Text style={[styles.unavailableTitle, { color: theme.pageText }]}>Coworking indisponible</Text><Text style={[styles.unavailableText, { color: theme.pageTextMuted }]}>L’espace réapparaîtra dès que le service temps réel sera activé.</Text><Pressable onPress={() => router.back()} style={[styles.backAction, { backgroundColor: theme.surfaceStrong }]}><Text style={{ color: theme.pageText, fontWeight: "900" }}>Retour</Text></Pressable></View>;
  }

  return (
    <View style={[styles.screen, { backgroundColor: theme.pageBackground }]}>
      <LinearGradient colors={theme.pageGradient} style={StyleSheet.absoluteFill} />
      <View pointerEvents="none" style={styles.officeBackdrop}>
        <View style={[styles.zone, styles.zoneQuiet, { borderColor: theme.borderSoft }]}><Text style={[styles.zoneLabel, { color: theme.pageTextMuted }]}>FOCUS</Text></View>
        <View style={[styles.zone, styles.zoneOpen, { borderColor: theme.borderSoft }]}><Text style={[styles.zoneLabel, { color: theme.pageTextMuted }]}>ESPACE OUVERT</Text></View>
        <View style={[styles.zone, styles.zoneBreak, { borderColor: theme.borderSoft }]}><Text style={[styles.zoneLabel, { color: theme.pageTextMuted }]}>PAUSE</Text></View>
        {Array.from({ length: 7 }).map((_, index) => <View key={`v-${index}`} style={[styles.gridLineVertical, { left: `${12 + index * 13}%`, backgroundColor: theme.borderSoft }]} />)}
        {Array.from({ length: 6 }).map((_, index) => <View key={`h-${index}`} style={[styles.gridLineHorizontal, { top: `${14 + index * 15}%`, backgroundColor: theme.borderSoft }]} />)}
      </View>

      <View style={styles.avatarLayer} pointerEvents="none">
        {participants.map((participant, index) => {
          const member = members.find((item) => item.id === participant.userId);
          if (!member) return null;
          const pos = layout[participant.userId];
          if (!pos) return null;
          return <View key={`fallback-${participant.userId}`} style={[styles.fallbackNode, { left: `${pos.x}%`, top: `${pos.y}%`, width: pos.width, height: pos.height, marginLeft: -pos.width / 2, marginTop: -pos.height / 2, borderColor: theme.borderSoft, backgroundColor: theme.surfaceStrong }]}>{participant.cameraOn && member.avatarUrl ? <Image source={{ uri: member.avatarUrl }} style={styles.fallbackImage} resizeMode="cover" /> : <StatusAvatar user={member} size={participant.cameraOn ? 62 : 52} accessible={false} />}</View>;
        })}
      </View>

      {mediaSession ? <View pointerEvents="none" style={styles.mediaLayer}><CoworkingMediaSurface session={mediaSession} displayName={currentUser.name} cameraOn={currentPresence?.cameraOn ?? false} microphoneOn={currentPresence?.microphoneOn ?? false} mapMode participantLayout={layout} onError={setMediaError} /></View> : null}

      <View style={styles.interactionLayer} pointerEvents="box-none">
        {participants.map((participant) => {
          const member = members.find((item) => item.id === participant.userId);
          const pos = layout[participant.userId];
          if (!member || !pos) return null;
          const meta = PRESENCE_META[participant.mode];
          return (
            <Pressable
              key={participant.userId}
              accessibilityRole="button"
              accessibilityLabel={`${member.name}, ${meta.label}${participant.cameraOn ? ", caméra active" : ""}`}
              onPress={() => setSelectedUserId(participant.userId)}
              style={({ pressed }) => [styles.personHit, { left: `${pos.x}%`, top: `${pos.y}%`, width: pos.width + 16, height: pos.height + 32, marginLeft: -(pos.width + 16) / 2, marginTop: -(pos.height + 32) / 2 }, pressed && styles.personPressed]}
            >
              <View style={[styles.personFrame, { width: pos.width, height: pos.height, borderColor: participant.speaking ? meta.tone : participant.cameraOn ? theme.violet : theme.borderSoft }]} />
              <View style={[styles.personStatus, { backgroundColor: theme.surface, borderColor: meta.tone }]}><View style={[styles.statusDot, { backgroundColor: meta.tone }]} /><Text style={[styles.statusText, { color: theme.pageText }]}>{meta.label}</Text>{participant.cameraOn ? <Ionicons name="videocam" size={11} color={theme.violet} /> : null}</View>
              <Text numberOfLines={1} style={[styles.personName, { color: theme.pageText }]}>{member.name.split(" ")[0]}</Text>
            </Pressable>
          );
        })}
      </View>

      <View style={[styles.topBar, { paddingTop: Math.max(insets.top, 10), paddingLeft: Math.max(insets.left, 10), paddingRight: Math.max(insets.right, 10) }]}>
        <Pressable accessibilityLabel="Fermer le coworking" onPress={() => router.back()} style={[styles.circleButton, { backgroundColor: theme.surface, borderColor: theme.borderSoft }]}><Ionicons name="close" size={22} color={theme.pageText} /></Pressable>
        <View style={[styles.liveTitle, { backgroundColor: theme.surface, borderColor: theme.borderSoft }]}><View style={styles.liveDot} /><View><Text style={[styles.title, { color: theme.pageText }]}>Coworking</Text><Text style={[styles.subtitle, { color: theme.pageTextMuted }]}>{loading ? "Connexion…" : `${activeCount} présent${activeCount > 1 ? "s" : ""}`}</Text></View></View>
        <Pressable accessibilityLabel="Actualiser la map" onPress={() => undefined} style={[styles.circleButton, { backgroundColor: theme.surface, borderColor: theme.borderSoft }]}><Ionicons name="locate-outline" size={20} color={theme.pageText} /></Pressable>
      </View>

      {currentSpace ? <ScrollView horizontal showsHorizontalScrollIndicator={false} style={[styles.presenceRail, { top: Math.max(insets.top, 10) + 62 }]} contentContainerStyle={styles.presenceRailContent}>{(["available", "focus", "break", "talk"] as CoworkingPresenceMode[]).map((mode) => { const meta = PRESENCE_META[mode]; const active = currentPresence?.mode === mode; return <Pressable key={mode} onPress={() => void updatePresence(mode)} style={[styles.presenceChip, { backgroundColor: active ? meta.tone : theme.surface, borderColor: active ? meta.tone : theme.borderSoft }]}><Ionicons name={meta.icon} size={14} color={active ? "#FFFFFF" : meta.tone} /><Text style={[styles.presenceChipText, { color: active ? "#FFFFFF" : theme.pageText }]}>{meta.label}</Text></Pressable>; })}</ScrollView> : null}

      {!currentSpace ? <View style={[styles.joinDock, { bottom: Math.max(insets.bottom, 12), backgroundColor: theme.surface, borderColor: theme.borderSoft }]}><View style={styles.joinCopy}><Text style={[styles.joinTitle, { color: theme.pageText }]}>Le bureau est ouvert</Text><Text style={[styles.joinText, { color: theme.pageTextMuted }]}>Entre sans rendez-vous. Micro coupé par défaut.</Text></View><Pressable accessibilityRole="button" accessibilityLabel="Rejoindre le coworking" onPress={() => void joinHub()} disabled={joining} style={styles.joinButton}><LinearGradient colors={gradients.primary} style={styles.joinGradient}><Ionicons name="enter-outline" size={19} color="#FFFFFF" /><Text style={styles.joinButtonText}>{joining ? "Connexion…" : "J’entre"}</Text></LinearGradient></Pressable></View> : <Pressable accessibilityRole="button" accessibilityLabel="Quitter le coworking" onPress={() => void leaveCurrentSpace()} style={[styles.leaveButton, { bottom: Math.max(insets.bottom, 14), backgroundColor: theme.surface, borderColor: theme.danger }]}><Ionicons name="exit-outline" size={18} color={theme.danger} /></Pressable>}

      {(error || mediaError) ? <View style={[styles.errorPill, { top: Math.max(insets.top, 10) + (currentSpace ? 112 : 64), backgroundColor: theme.dangerSoft }]}><Text style={[styles.errorText, { color: theme.danger }]}>{mediaError ?? error}</Text></View> : null}

      {selectedMember && selectedPresence ? <Pressable style={styles.sheetBackdrop} onPress={() => setSelectedUserId(null)}><Pressable onPress={() => undefined} style={[styles.personSheet, { paddingBottom: Math.max(insets.bottom, 14), backgroundColor: theme.surface, borderColor: theme.borderSoft }]}><View style={styles.sheetHandle} /><View style={styles.sheetMember}><StatusAvatar user={selectedMember} size={52} accessible={false} /><View style={styles.sheetCopy}><Text style={[styles.sheetName, { color: theme.pageText }]}>{selectedMember.name}</Text><Text style={[styles.sheetCompany, { color: theme.pageTextMuted }]} numberOfLines={1}>{selectedMember.company}</Text><View style={styles.sheetPresence}><View style={[styles.statusDot, { backgroundColor: PRESENCE_META[selectedPresence.mode].tone }]} /><Text style={[styles.sheetPresenceText, { color: theme.pageTextSecondary }]}>{selectedPresence.statusText || PRESENCE_META[selectedPresence.mode].label}{selectedPresence.cameraOn ? " · en visio" : ""}</Text></View></View></View><View style={styles.sheetActions}><Pressable onPress={sayHello} style={[styles.sheetAction, { backgroundColor: theme.violetSoft }]}><Ionicons name="hand-left-outline" size={20} color={theme.violet} /><Text style={[styles.sheetActionText, { color: theme.pageText }]}>Dire bonjour</Text></Pressable>{selectedSpace ? <Pressable onPress={() => void joinSelected()} disabled={joining} style={[styles.sheetAction, { backgroundColor: theme.accentSoft }]}><Ionicons name="people-outline" size={20} color={theme.accent} /><Text style={[styles.sheetActionText, { color: theme.pageText }]}>{currentSpace?.id === selectedSpace.id ? "Ouvrir l’espace" : "Les rejoindre"}</Text></Pressable> : null}<Pressable onPress={() => { const id = selectedMember.id; setSelectedUserId(null); router.push(`/profile/${encodeURIComponent(id)}`); }} style={[styles.sheetAction, { backgroundColor: theme.surfaceStrong }]}><Ionicons name="person-outline" size={20} color={theme.pageTextMuted} /><Text style={[styles.sheetActionText, { color: theme.pageText }]}>Profil</Text></Pressable></View></Pressable></Pressable> : null}
    </View>
  );
}

