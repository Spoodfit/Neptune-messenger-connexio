                        </View>
                        {!announcementUnread ? <Text numberOfLines={1} style={[styles.announcementPreview, { color: theme.pageTextMuted }]}>{announcement.lastMessage ?? "Consulter les annonces Neptune"}</Text> : null}
                      </View>
                      {!announcementUnread ? <Ionicons name="chevron-forward" size={18} color={theme.pageTextMuted} /> : null}
                    </View>
                    {announcementUnread ? (
                      <>
                        <Text style={[styles.announcementFullText, { color: theme.pageText }]}>{announcement.lastMessage ?? "Nouvelle annonce Neptune"}</Text>
