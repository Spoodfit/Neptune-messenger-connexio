name: Apply Connexio V24 messaging and coworking map

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v24-implementation.yml

permissions:
  contents: write

jobs:
  apply-v24:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V24 branch
        uses: actions/checkout@v4
        with:
          ref: fix/v24-messaging-coworking-map
          fetch-depth: 0

      - name: Apply versioned V24 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin e3da09e4eeb4c9c7b7c53ac40438a14b562580a0
          python - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output([
              "git", "show", "e3da09e4eeb4c9c7b7c53ac40438a14b562580a0:.github/workflows/v24-implementation.yml"
          ], text=True)
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Setup Node"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch = textwrap.dedent(source[start:end])
          exec(compile(patch, "v24_patch.py", "exec"), {"__name__": "__main__"})
          PY

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app src docs
          git commit -m "feat(v24): refine messaging and move coworking into live map"
          git push origin HEAD:fix/v24-messaging-coworking-map

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate V24
        run: npm run verify && npm run audit:rc && npx expo install --check
