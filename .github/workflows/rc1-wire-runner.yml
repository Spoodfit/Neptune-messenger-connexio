name: RC1 wire deterministic runner

on:
  pull_request:
    branches:
      - feat/v14-ux-calls-moderation
    paths:
      - .github/workflows/rc1-wire-runner.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Wire runner and post-fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rc1-hardening.yml')
          content = path.read_text(encoding='utf-8')
          old = '''          python -m py_compile scripts/rc1_apply.py
          python scripts/rc1_apply.py
'''
          new = '''          python -m py_compile scripts/rc1_apply.py scripts/rc1_runner.py scripts/rc1_postfix.py
          python scripts/rc1_runner.py
          python scripts/rc1_postfix.py
'''
          if old not in content:
              raise SystemExit('Étape rc1_apply introuvable')
          content = content.replace(old, new, 1)
          cleanup_old = '''          git rm -f --ignore-unmatch scripts/rc1_apply.py
          git rm -f --ignore-unmatch scripts/.rc1_*.b64
'''
          cleanup_new = '''          git rm -f --ignore-unmatch scripts/rc1_apply.py scripts/rc1_runner.py scripts/rc1_postfix.py
          git rm -f --ignore-unmatch scripts/.rc1_*.b64
'''
          if cleanup_old not in content:
              raise SystemExit('Nettoyage rc1_apply introuvable')
          content = content.replace(cleanup_old, cleanup_new, 1)
          path.write_text(content, encoding='utf-8')
          PY
          git rm .github/workflows/rc1-wire-runner.yml
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: wire deterministic RC hardening runner"
          git push origin HEAD:release/connexio-rc1
