name: Probe current EAS Android build

on:
  push:
    branches:
      - release/connexio-rc1
    paths:
      - scripts/.eas-status-probe

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Inspecter EAS sans lancer de build
        shell: bash
        run: |
          mkdir -p builds
          if [ -z "$EXPO_TOKEN" ]; then
            printf '{"ok":false,"error":"EXPO_TOKEN missing"}\n' > builds/eas-android-status.json
          else
            set +e
            npx --yes eas-cli@21.7.1 build:list --platform android --limit 10 --json --non-interactive > builds/eas-android-list.raw.json 2> builds/eas-android-status.stderr
            code=$?
            set -e
            STATUS_CODE="$code" node - <<'NODE'
          const fs = require('fs');
          const code = Number(process.env.STATUS_CODE || '1');
          const stdout = fs.existsSync('builds/eas-android-list.raw.json') ? fs.readFileSync('builds/eas-android-list.raw.json','utf8') : '';
          const stderr = fs.existsSync('builds/eas-android-status.stderr') ? fs.readFileSync('builds/eas-android-status.stderr','utf8') : '';
          let builds = null;
          try { builds = stdout.trim() ? JSON.parse(stdout) : null; } catch {}
          fs.writeFileSync('builds/eas-android-status.json', JSON.stringify({ ok: code === 0, exitCode: code, builds, stderr: stderr.slice(-4000) }, null, 2) + '\n');
          NODE
          fi
          cat builds/eas-android-status.json
      - name: Publier le diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/eas-android-status.json
          if [ -f builds/eas-android-status.stderr ]; then git add -f builds/eas-android-status.stderr; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(build): capture EAS Android diagnostic [skip ci]"
          git push origin HEAD:release/connexio-rc1
