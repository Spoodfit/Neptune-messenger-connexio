name: Probe current EAS Android build

on:
  push:
    branches:
      - release/connexio-rc1
    paths:
      - scripts/.eas-status-probe

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PUBLIC_EAS_PROJECT_ID: d2288b09-8249-4879-810f-7cb0072baeeb

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Inspecter authentification, projet et builds EAS
        shell: bash
        run: |
          mkdir -p builds
          : > builds/eas-diagnostic.log
          if [ -z "$EXPO_TOKEN" ]; then
            printf '{"ok":false,"tokenPresent":false,"error":"EXPO_TOKEN missing"}\n' > builds/eas-android-status.json
            exit 0
          fi

          run_diag() {
            label="$1"
            shift
            printf '\n===== %s =====\n' "$label" >> builds/eas-diagnostic.log
            set +e
            "$@" >> builds/eas-diagnostic.log 2>&1
            code=$?
            set -e
            printf '\n[exit=%s]\n' "$code" >> builds/eas-diagnostic.log
            return 0
          }

          run_diag "eas-version" npx --yes eas-cli@21.7.1 --version
          run_diag "eas-whoami" npx --yes eas-cli@21.7.1 whoami
          run_diag "expo-config" npx expo config --type public
          run_diag "eas-project-info" npx --yes eas-cli@21.7.1 project:info --json

          set +e
          npx --yes eas-cli@21.7.1 build:list --platform android --limit 10 --json > builds/eas-android-list.raw.json 2>> builds/eas-diagnostic.log
          build_code=$?
          set -e
          printf '\n===== eas-build-list =====\n[exit=%s]\n' "$build_code" >> builds/eas-diagnostic.log

          STATUS_CODE="$build_code" node - <<'NODE'
          const fs = require('fs');
          const code = Number(process.env.STATUS_CODE || '1');
          const stdout = fs.existsSync('builds/eas-android-list.raw.json') ? fs.readFileSync('builds/eas-android-list.raw.json','utf8') : '';
          const diagnostic = fs.existsSync('builds/eas-diagnostic.log') ? fs.readFileSync('builds/eas-diagnostic.log','utf8') : '';
          let builds = null;
          let parseError = null;
          try { builds = stdout.trim() ? JSON.parse(stdout) : null; } catch (error) { parseError = String(error); }
          fs.writeFileSync('builds/eas-android-status.json', JSON.stringify({
            ok: code === 0,
            tokenPresent: true,
            exitCode: code,
            builds,
            parseError,
            diagnostic: diagnostic.slice(-12000)
          }, null, 2) + '\n');
          NODE
          cat builds/eas-android-status.json
      - name: Publier le diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/eas-android-status.json builds/eas-diagnostic.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(build): capture EAS Android diagnostic [skip ci]"
          git push origin HEAD:release/connexio-rc1
