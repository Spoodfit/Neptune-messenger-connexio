name: V15 cleanup

on:
  push:
    branches:
      - feat/v15-ux-navigation-calls
    paths:
      - .github/workflows/v15-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v15-ux-navigation-calls
      - name: Remove temporary V15 diagnostics
        run: |
          rm -f .github/workflows/v15-asset-fix.yml
          rm -f .github/workflows/v15-product-diagnostic.yml
          rm -f v15-product-audit-diagnostic.log
          rm -f .github/workflows/v15-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove V15 temporary diagnostics"
          git push origin HEAD:feat/v15-ux-navigation-calls
