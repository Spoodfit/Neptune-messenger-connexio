name: Apply Radar Smart Dock

on:
  push:
    branches:
      - release/connexio-rc1
    paths:
      - .github/workflows/radar-smart-dock-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Radar daily-use UX corrections
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function writeChanged(path, transform) {
            const source = fs.readFileSync(path, 'utf8');
            const next = transform(source);
            if (next === source) throw new Error(`No change produced for ${path}`);
            fs.writeFileSync(path, next);
          }

          function text(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`Missing anchor: ${label}`);
            return source.replace(before, after);
          }

          function regex(source, pattern, after, label) {
            if (!pattern.test(source)) throw new Error(`Missing regex anchor: ${label}`);
            return source.replace(pattern, after);
          }

          const screen = 'src/screens/UnifiedMapScreenV24.tsx';
          writeChanged(screen, (input) => {
            let source = input;

            source = text(
              source,
              '  const [interactionClock, setInteractionClock] = useState(() => Date.now());\n  const tabBarClearance = 92;',
              '  const [interactionClock, setInteractionClock] = useState(() => Date.now());\n  const [opportunityExpanded, setOpportunityExpanded] = useState(false);\n  const tabBarClearance = 92;',
              'smart dock state'
            );

            source = text(
              source,
              '  const nextEvent = visibleEvents.find((event) => getDiscoveryEventState(event, eventClock) !== "recent");',
              '  const liveEvents = visibleEvents.filter((event) => getDiscoveryEventState(event, eventClock) === "live");\n  const upcomingEvents = visibleEvents.filter((event) => {\n    const state = getDiscoveryEventState(event, eventClock);\n    return state !== "recent" && state !== "live";\n  });\n  const nextEvent = upcomingEvents[0] ?? liveEvents[0];\n  const priorityEvent = liveEvents[0] ?? nextEvent;',
              'event priority model'
            );

            source = text(
              source,
              '  const selectMarker = (markerId: string) => {\n    const marker = markers.find((item) => item.id === markerId);',
              '  const selectMarker = (markerId: string) => {\n    setOpportunityExpanded(false);\n    const marker = markers.find((item) => item.id === markerId);',
              'collapse on member selection'
            );
            source = text(
              source,
              '  const selectEvent = (eventId: string) => {\n    setSelectedCluster(null);',
              '  const selectEvent = (eventId: string) => {\n    setOpportunityExpanded(false);\n    setSelectedCluster(null);',
              'collapse on event selection'
            );
            source = text(
              source,
              '  const closeSelection = () => {\n    setSelectedCluster(null);',
              '  const closeSelection = () => {\n    setOpportunityExpanded(false);\n    setSelectedCluster(null);',
              'collapse on close'
            );
            source = text(
              source,
              '  const selectCluster = (clusterSelection: CoworkingMapClusterSelection) => {\n    setSelectedMarkerId(null);',
              '  const selectCluster = (clusterSelection: CoworkingMapClusterSelection) => {\n    setOpportunityExpanded(false);\n    setSelectedMarkerId(null);',
              'collapse on cluster selection'
            );

            const radarBlock = [
              '  const radarSummary = radarMode === "available"',
              '    ? `${availableMembers.length} disponibles maintenant`',
              '    : radarMode === "events"',
              '      ? `${visibleEvents.length} évènements à découvrir`',
              '      : `${eligibleMemberCount} membres · ${visibleEvents.length} évènements`;',
              '  const availableLabel = t(availableMembers.length === 1 ? "personne disponible maintenant" : "personnes disponibles maintenant");',
              '  const liveEventLabel = t(liveEvents.length === 1 ? "évènement en cours" : "évènements en cours");',
              '  const upcomingLabel = t(upcomingEvents.length === 1 ? "évènement à venir" : "évènements à venir");',
              '  const compactOpportunitySummary = availableMembers.length > 0 && liveEvents.length > 0',
              '    ? availableMembers.length + " " + availableLabel + " · " + liveEvents.length + " " + liveEventLabel',
              '    : availableMembers.length > 0',
              '      ? availableMembers.length + " " + availableLabel',
              '      : liveEvents.length > 0',
              '        ? liveEvents.length + " " + liveEventLabel',
              '        : upcomingEvents.length > 0',
              '          ? upcomingEvents.length + " " + upcomingLabel',
              '          : t("Rien d’urgent maintenant");',
              '  const controlsTop = Math.max(insets.top, 10) + 118;',
              ''
            ].join('\n');
            source = regex(
              source,
              /  const radarSummary = radarMode === "available"[\s\S]*?  const controlsTop = Math\.max\(insets\.top, 10\) \+ 126;\n/,
              radarBlock,
              'radar summary and controls'
            );

            source = text(
              source,
              '        onSelectCluster={selectCluster}\n        onLocationUnavailable={() => AppAlert.alert("Localisation indisponible", "Activez la localisation pour recentrer la carte autour de vous.")}',
              '        onSelectCluster={selectCluster}\n        onInteraction={() => setOpportunityExpanded(false)}\n        onLocationUnavailable={() => AppAlert.alert("Localisation indisponible", "Activez la localisation pour recentrer la carte autour de vous.")}',
              'map interaction callback'
            );

            const smartDock = String.raw`      {!selection && !selectedEvent && !selectedCluster && radarMode === "all" ? (
        <View
          style={[
            styles.smartDock,
            opportunityExpanded ? styles.smartDockExpanded : styles.smartDockCompact,
            { bottom: tabBarClearance, backgroundColor: theme.shellBackground, borderColor: theme.borderSoft }
          ]}
        >
          <Pressable
            accessibilityRole="button"
            accessibilityLabel={t(opportunityExpanded ? "Réduire ce panneau" : "Ouvrir ce panneau")}
            onPress={() => setOpportunityExpanded((value) => !value)}
            style={({ pressed }) => [styles.smartDockToggle, pressed && styles.pressed]}
          >
            <View style={styles.smartDockSignal}>
              <View style={[styles.liveDot, { backgroundColor: availableMembers.length > 0 || liveEvents.length > 0 ? theme.success : theme.pageTextMuted }]} />
              <Text numberOfLines={1} style={[styles.smartDockTitle, { color: theme.pageText }]}>
                {opportunityExpanded ? t("Maintenant autour de vous") : compactOpportunitySummary}
              </Text>
            </View>
            <Ionicons name={opportunityExpanded ? "chevron-down" : "chevron-up"} size={18} color={theme.pageTextMuted} />
          </Pressable>

          {opportunityExpanded ? (
            <View style={styles.opportunityRail}>
              {availableMembers.length > 0 ? (
                <Pressable accessibilityRole="button" accessibilityLabel={t("Voir les personnes disponibles maintenant")} onPress={() => changeRadarMode("available")} style={[styles.opportunityCard, { backgroundColor: theme.surfaceStrong, borderColor: theme.borderSoft }]}>
                  <View style={styles.avatarPreview}>
                    {availableMembers.slice(0, 3).map((member, index) => <View key={member.id} style={index > 0 ? styles.stackedAvatar : undefined}><StatusAvatar user={member} size={32} accessible={false} /></View>)}
                  </View>
                  <View style={styles.opportunityCopy}>
                    <Text numberOfLines={1} style={[styles.opportunityTitle, { color: theme.pageText }]}>{availableMembers.length + " " + availableLabel}</Text>
                    <Text numberOfLines={1} style={[styles.opportunityMeta, { color: theme.success }]}>{t("Échanger maintenant")}</Text>
                  </View>
                  <Ionicons name="chevron-forward" size={17} color={theme.pageTextMuted} />
                </Pressable>
              ) : null}

              {priorityEvent ? (
                <Pressable accessibilityRole="button" accessibilityLabel={t("Sélectionner l’évènement") + " " + priorityEvent.title} onPress={() => selectEvent(priorityEvent.id)} style={[styles.opportunityCard, styles.eventOpportunityCard, { backgroundColor: theme.surfaceStrong, borderColor: theme.borderSoft }]}>
                  <View style={[styles.dateTile, { backgroundColor: theme.accentSoft, borderColor: getDiscoveryEventState(priorityEvent, eventClock) === "live" ? theme.success : theme.accent }]}>
                    <Text style={[styles.dateDay, { color: theme.pageText }]}>{new Date(priorityEvent.startsAt).getDate().toString().padStart(2, "0")}</Text>
                    <Text style={[styles.dateMonth, { color: theme.pageTextMuted }]}>{new Date(priorityEvent.startsAt).toLocaleString(localeTag, { month: "short" }).replace(".", "")}</Text>
                  </View>
                  <View style={styles.opportunityCopy}>
                    <Text numberOfLines={1} style={[styles.opportunityTitle, { color: theme.pageText }]}>{priorityEvent.title}</Text>
                    <Text numberOfLines={1} style={[styles.opportunityMeta, { color: getDiscoveryEventState(priorityEvent, eventClock) === "live" ? theme.success : theme.pageTextMuted }]}>{eventStatusLabel(priorityEvent, eventClock)}{priorityEvent.city ? " · " + priorityEvent.city : ""}</Text>
                  </View>
                  <Ionicons name="chevron-forward" size={17} color={theme.pageTextMuted} />
                </Pressable>
              ) : null}

              {visibleEvents.length > 0 ? (
                <Pressable accessibilityRole="button" accessibilityLabel={t("Voir tous les évènements")} onPress={() => changeRadarMode("events")} style={[styles.allEventsButton, { backgroundColor: theme.surfaceStrong, borderColor: theme.borderSoft }]}>
                  <View style={styles.allEventsCopy}>
                    <Ionicons name="calendar-outline" size={17} color={theme.pageText} />
                    <Text numberOfLines={1} style={[styles.allEventsText, { color: theme.pageText }]}>{t("Voir tous les évènements")}</Text>
                  </View>
                  <View style={[styles.countBadge, { backgroundColor: theme.violetSoft }]}>
                    <Text style={[styles.countBadgeText, { color: theme.violet }]}>{visibleEvents.length}</Text>
                  </View>
                </Pressable>
              ) : null}

              {availableMembers.length === 0 && !priorityEvent && visibleEvents.length === 0 ? (
                <View style={styles.emptyDockRow}>
                  <Ionicons name="checkmark-circle-outline" size={18} color={theme.pageTextMuted} />
                  <Text style={[styles.emptyDockText, { color: theme.pageTextMuted }]}>{t("Rien d’urgent maintenant")}</Text>
                </View>
              ) : null}
            </View>
          ) : null}
        </View>
      ) : null}`;

            source = regex(
              source,
              /      \{!selection && !selectedEvent && !selectedCluster \? \([\s\S]*?\n      \) : null\}\n\n      \{notice \? \(/,
              smartDock + '\n\n      {notice ? (',
              'replace opportunity dock'
            );

            source = text(
              source,
              '{ bottom: tabBarClearance + 76, backgroundColor: theme.pageText }',
              '{ bottom: tabBarClearance + (opportunityExpanded && radarMode === "all" ? 224 : 66), backgroundColor: theme.pageText }',
              'notice clearance'
            );

            source = text(source, '  circleButton: { width: 48, height: 48, borderRadius: 24, borderWidth: 1, alignItems: "center", justifyContent: "center" },', '  circleButton: { width: 44, height: 44, borderRadius: 22, borderWidth: 1, alignItems: "center", justifyContent: "center" },', 'compact circle buttons');
            source = text(source, '  titlePill: { flex: 1, minHeight: 52, maxWidth: 264, paddingLeft: 12, paddingRight: 4, borderRadius: 20, borderWidth: 1, flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: 5 },', '  titlePill: { flex: 1, minHeight: 48, maxWidth: 260, paddingLeft: 11, paddingRight: 4, borderRadius: 19, borderWidth: 1, flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: 5 },', 'compact title');
            source = text(source, '  ownStatus: { minWidth: 70, minHeight: 48, borderRadius: 17, borderWidth: 1, paddingHorizontal: 7, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 4 },', '  ownStatus: { minWidth: 70, minHeight: 42, borderRadius: 16, borderWidth: 1, paddingHorizontal: 7, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 4 },', 'compact own status');
            source = text(source, '  modeRail: { position: "absolute", left: 12, right: 12, minHeight: 56, borderRadius: 20, borderWidth: 1, padding: 3, flexDirection: "row", alignItems: "center", gap: 3 },', '  modeRail: { position: "absolute", left: 12, right: 12, minHeight: 52, borderRadius: 19, borderWidth: 1, padding: 3, flexDirection: "row", alignItems: "center", gap: 3 },', 'compact mode rail');
            source = text(source, '  modeButton: { flex: 1, minWidth: 0, minHeight: 48, borderRadius: 16, paddingHorizontal: 7, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 5 },', '  modeButton: { flex: 1, minWidth: 0, minHeight: 44, borderRadius: 15, paddingHorizontal: 7, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 5 },', 'compact mode buttons');

            const dockStyles = String.raw`  smartDock: { position: "absolute", left: 10, right: 10, borderRadius: 21, borderWidth: 1, shadowColor: "#000", shadowOpacity: 0.22, shadowRadius: 16, shadowOffset: { width: 0, height: 7 }, elevation: 14 },
  smartDockCompact: { paddingHorizontal: 12, paddingVertical: 7 },
  smartDockExpanded: { padding: 10, gap: 8 },
  smartDockToggle: { minHeight: 42, flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: 8 },
  smartDockSignal: { flex: 1, minWidth: 0, flexDirection: "row", alignItems: "center", gap: 7 },
  smartDockTitle: { flex: 1, minWidth: 0, fontSize: 11, lineHeight: 14, fontWeight: "900" },
  liveDot: { width: 8, height: 8, borderRadius: 4 },
  opportunityRail: { gap: 6 },`;
            source = regex(
              source,
              /  opportunityDock: \{[\s\S]*?  opportunityRail: \{ gap: 6 \},/,
              dockStyles,
              'smart dock styles'
            );
            source = text(source, '  opportunityCard: { minHeight: 58, borderRadius: 18, borderWidth: 1, padding: 8, flexDirection: "row", alignItems: "center", gap: 8 },', '  opportunityCard: { minHeight: 56, borderRadius: 17, borderWidth: 1, padding: 8, flexDirection: "row", alignItems: "center", gap: 8 },', 'compact opportunity cards');
            source = text(
              source,
              '  opportunityMeta: { marginTop: 3, fontSize: 9, lineHeight: 12, fontWeight: "800" },',
              '  opportunityMeta: { marginTop: 3, fontSize: 9, lineHeight: 12, fontWeight: "800" },\n  allEventsButton: { minHeight: 42, borderRadius: 15, borderWidth: 1, paddingHorizontal: 10, flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: 8 },\n  allEventsCopy: { flex: 1, minWidth: 0, flexDirection: "row", alignItems: "center", gap: 7 },\n  allEventsText: { flex: 1, minWidth: 0, fontSize: 10, lineHeight: 13, fontWeight: "900" },\n  countBadge: { minWidth: 26, height: 24, paddingHorizontal: 7, borderRadius: 12, alignItems: "center", justifyContent: "center" },\n  countBadgeText: { fontSize: 9, lineHeight: 12, fontWeight: "900", fontVariant: ["tabular-nums"] },\n  emptyDockRow: { minHeight: 42, borderRadius: 15, paddingHorizontal: 10, flexDirection: "row", alignItems: "center", gap: 8 },\n  emptyDockText: { flex: 1, minWidth: 0, fontSize: 10, lineHeight: 13, fontWeight: "800" },',
              'smart dock secondary styles'
            );

            return source;
          });

          const types = 'src/components/CoworkingGeographicMap.types.ts';
          writeChanged(types, (source) => text(
            source,
            '  onSelectCluster?: (selection: CoworkingMapClusterSelection) => void;\n  onLocationUnavailable?: () => void;',
            '  onSelectCluster?: (selection: CoworkingMapClusterSelection) => void;\n  onInteraction?: () => void;\n  onLocationUnavailable?: () => void;',
            'map interaction prop type'
          ));

          const web = 'src/components/CoworkingGeographicMap.web.tsx';
          writeChanged(web, (input) => {
            let source = input;
            source = text(source, '  onSelectCluster,\n  onLocationUnavailable', '  onSelectCluster,\n  onInteraction,\n  onLocationUnavailable', 'web prop');
            source = text(source, '  const onSelectClusterRef = useRef(onSelectCluster);', '  const onSelectClusterRef = useRef(onSelectCluster);\n  const onInteractionRef = useRef(onInteraction);', 'web interaction ref');
            source = text(
              source,
              '    onSelectClusterRef.current = onSelectCluster;\n  }, [onSelectCluster, onSelectEvent, onSelectMarker]);',
              '    onSelectClusterRef.current = onSelectCluster;\n    onInteractionRef.current = onInteraction;\n  }, [onInteraction, onSelectCluster, onSelectEvent, onSelectMarker]);',
              'web ref sync'
            );
            source = text(
              source,
              '      if (event.data?.source !== "connexio-coworking-map") return;\n      if (event.data?.type === "marker-selected"',
              '      if (event.data?.source !== "connexio-coworking-map") return;\n      if (event.data?.type === "map-interaction") onInteractionRef.current?.();\n      if (event.data?.type === "marker-selected"',
              'web interaction message'
            );
            return source;
          });

          const native = 'src/components/CoworkingGeographicMap.native.tsx';
          writeChanged(native, (input) => {
            let source = input;
            source = text(source, '  onSelectCluster,\n  onLocationUnavailable', '  onSelectCluster,\n  onInteraction,\n  onLocationUnavailable', 'native prop');
            source = text(
              source,
              '      if (payload.type === "marker-selected" && payload.id) onSelectMarker(payload.id);',
              '      if (payload.type === "map-interaction") onInteraction?.();\n      if (payload.type === "marker-selected" && payload.id) onSelectMarker(payload.id);',
              'native interaction message'
            );
            return source;
          });

          const html = 'src/services/coworking/geographicMapHtml.ts';
          writeChanged(html, (source) => text(
            source,
            "  const map=L.map('map',{zoomControl:false,minZoom:4,maxZoom:18,zoomSnap:.25,attributionControl:true});",
            "  const map=L.map('map',{zoomControl:false,minZoom:4,maxZoom:18,zoomSnap:.25,attributionControl:true});\n  map.on('movestart zoomstart dragstart',()=>post({type:'map-interaction'}));",
            'leaflet interaction bridge'
          ));

          const translations = 'src/i18n/uiTranslationsV27.ts';
          writeChanged(translations, (source) => {
            const entries = String.raw`  "Maintenant autour de vous": { en: "Now around you", es: "Ahora a tu alrededor", de: "Jetzt in deiner Nähe", it: "Ora intorno a te", pt: "Agora à sua volta" },
  "Rien d’urgent maintenant": { en: "Nothing urgent right now", es: "Nada urgente ahora", de: "Gerade nichts Dringendes", it: "Niente di urgente ora", pt: "Nada urgente agora" },
  "Voir tous les évènements": { en: "See all events", es: "Ver todos los eventos", de: "Alle Veranstaltungen ansehen", it: "Vedi tutti gli eventi", pt: "Ver todos os eventos" },
  "Réduire ce panneau": { en: "Collapse this panel", es: "Reducir este panel", de: "Dieses Panel einklappen", it: "Riduci questo pannello", pt: "Recolher este painel" },
  "Ouvrir ce panneau": { en: "Open this panel", es: "Abrir este panel", de: "Dieses Panel öffnen", it: "Apri questo pannello", pt: "Abrir este painel" },
  "personne disponible maintenant": { en: "person available now", es: "persona disponible ahora", de: "Person jetzt verfügbar", it: "persona disponibile ora", pt: "pessoa disponível agora" },
  "personnes disponibles maintenant": { en: "people available now", es: "personas disponibles ahora", de: "Personen jetzt verfügbar", it: "persone disponibili ora", pt: "pessoas disponíveis agora" },
  "évènement en cours": { en: "event happening now", es: "evento en curso", de: "laufende Veranstaltung", it: "evento in corso", pt: "evento a decorrer" },
  "évènements en cours": { en: "events happening now", es: "eventos en curso", de: "laufende Veranstaltungen", it: "eventi in corso", pt: "eventos a decorrer" },
  "évènement à venir": { en: "upcoming event", es: "evento próximo", de: "bevorstehende Veranstaltung", it: "evento in arrivo", pt: "próximo evento" },
  "évènements à venir": { en: "upcoming events", es: "eventos próximos", de: "bevorstehende Veranstaltungen", it: "eventi in arrivo", pt: "próximos eventos" },
`;
            return text(source, '  "À saisir maintenant":', entries + '  "À saisir maintenant":', 'translation insertion');
          });
          NODE

      - name: Remove one-time workflow before audits
        run: rm .github/workflows/radar-smart-dock-apply.yml

      - name: Validate source and tests
        run: npm run verify --silent

      - name: Build web preview
        env:
          EXPO_PUBLIC_GITHUB_PAGES: "true"
          EXPO_PUBLIC_MOCK_MODE: "true"
        run: npm run web:build

      - name: Commit validated correction
        run: |
          git config user.name "Connexio Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(map): replace blocking opportunity dock with smart dock"
          git push origin HEAD:release/connexio-rc1
