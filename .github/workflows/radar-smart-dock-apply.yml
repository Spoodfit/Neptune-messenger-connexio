name: Apply Radar Smart Dock

on:
  push:
    branches:
      - release/connexio-rc1
    paths:
      - .github/workflows/radar-smart-dock-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Radar daily-use UX corrections
        run: node scripts/apply-radar-smart-dock.cjs

      - name: Remove one-time patch files before audits
        run: rm .github/workflows/radar-smart-dock-apply.yml scripts/apply-radar-smart-dock.cjs

      - name: Validate source and tests
        run: npm run verify --silent

      - name: Build web preview
        env:
          EXPO_PUBLIC_GITHUB_PAGES: "true"
          EXPO_PUBLIC_MOCK_MODE: "true"
        run: npm run web:build

      - name: Commit validated correction
        run: |
          git config user.name "Connexio Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(map): replace blocking opportunity dock with smart dock"
          git push origin HEAD:release/connexio-rc1
