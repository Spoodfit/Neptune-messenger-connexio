name: Clean generated V14 test artifacts

on:
  pull_request:
    branches:
      - feat/production-hardening
    types:
      - synchronize
      - opened
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v14-ux-calls-moderation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Remove generated artifacts
        shell: bash
        run: |
          rm -rf .test-dist
          touch .gitignore
          grep -qxF '.test-dist/' .gitignore || printf '\n.test-dist/\n' >> .gitignore

      - name: Install dependencies
        run: npm ci

      - name: Verify without retaining generated output
        shell: bash
        run: |
          npm run verify
          rm -rf .test-dist

      - name: Commit clean tree
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-v14-test-dist.yml
          git config user.name "Neptune Product Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: ignore generated test artifacts"
          git push origin HEAD:feat/v14-ux-calls-moderation
