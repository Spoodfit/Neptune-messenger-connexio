name: V15 contact lock

on:
  push:
    branches:
      - feat/v15-ux-navigation-calls
    paths:
      - package.json
      - .github/workflows/v15-contact-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v15-ux-navigation-calls
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json package.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: lock Expo contacts dependency"
          git push origin HEAD:feat/v15-ux-navigation-calls
