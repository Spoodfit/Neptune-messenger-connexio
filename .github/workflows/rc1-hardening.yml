name: Connexio RC1 hardening

on:
  push:
    branches:
      - release/connexio-rc1
    paths:
      - .github/workflows/rc1-hardening.yml
  pull_request:
    branches:
      - feat/v14-ux-calls-moderation
    paths:
      - .github/workflows/rc1-hardening.yml

permissions:
  contents: write

jobs:
  build-validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: release/connexio-rc1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Prepare native asset tools
        run: |
          command -v convert
          command -v file
          python -m pip install --user --disable-pip-version-check "pillow==11.3.0"
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Restore and verify user-provided sounds
        run: |
          mkdir -p assets/audio
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          def compact(path: str) -> str:
              return "".join(Path(path).read_text(encoding="utf-8").split())

          ring0 = compact("scripts/.rc1_ringtone.00.b64")
          ring1 = compact("scripts/.rc1_ringtone.01.b64")
          ring2 = compact("scripts/.rc1_ringtone.02.b64")
          notif = compact("scripts/.rc1_notification.00.b64")

          if len(ring2) == 6354 and ring2[5790:5796] == "q" * 6:
              ring2 = ring2[:5790] + ring2[5796:]
          if len(notif) == 6166:
              notif = notif[:5896] + "q" * 12 + notif[5896:6164] + "q" * 10 + notif[6164:]

          ring_payload = ring0 + ring1 + ring2
          if len(ring_payload) != 22348 or len(notif) != 6188:
              raise SystemExit(
                  f"Longueurs audio invalides: sonnerie={len(ring_payload)}, notification={len(notif)}"
              )

          ring_bytes = base64.b64decode(ring_payload, validate=True)
          notif_bytes = base64.b64decode(notif, validate=True)
          expected = {
              "ring": "535457d19bc489f571e5fcdb7251d06beaf3309ec009ddf34d4e5bc0514ae906",
              "notif": "1f25cfcb689499ee422763e8e765af120c36aabf42269718d793d30bd3bacbac"
          }
          actual = {
              "ring": hashlib.sha256(ring_bytes).hexdigest(),
              "notif": hashlib.sha256(notif_bytes).hexdigest()
          }
          if actual != expected:
              raise SystemExit(f"Empreintes audio invalides: {actual}")

          Path("assets/audio/connexio-ringtone.mp3").write_bytes(ring_bytes)
          Path("assets/audio/connexio-notification.mp3").write_bytes(notif_bytes)
          print("Sonnerie:", len(ring_bytes), actual["ring"])
          print("Notification:", len(notif_bytes), actual["notif"])
          PY
          file assets/audio/connexio-ringtone.mp3 assets/audio/connexio-notification.mp3

      - name: Generate store assets from official Neptune mark
        run: |
          python - <<'PY'
          import base64
          import io
          import re
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          source = Path("src/assets/neptuneLogo.ts").read_text(encoding="utf-8")
          match = re.search(r"base64,([A-Za-z0-9+/=]+)", source)
          if not match:
              raise SystemExit("Logo Neptune base64 introuvable")
          raw = base64.b64decode(match.group(1))
          image = Image.open(io.BytesIO(raw))
          image.load()
          image.convert("RGBA").save("/tmp/neptune-logo-repaired.png", format="PNG", optimize=True)
          print("Logo réparé:", image.size, image.mode)
          PY
          mkdir -p assets
          convert /tmp/neptune-logo-repaired.png -resize 720x720 -gravity center -background '#020713' -extent 1024x1024 assets/icon.png
          convert /tmp/neptune-logo-repaired.png -resize 640x640 -gravity center -background none -extent 1024x1024 assets/adaptive-icon.png
          convert /tmp/neptune-logo-repaired.png -resize 520x520 -gravity center -background none -extent 1024x1024 assets/splash-icon.png
          convert /tmp/neptune-logo-repaired.png -resize 48x48 assets/favicon.png
          convert /tmp/neptune-logo-repaired.png -resize 72x72 -gravity center -background none -extent 96x96 -colorspace Gray -threshold 25% -fill white -colorize 100 assets/notification-icon.png
          identify assets/icon.png assets/adaptive-icon.png assets/splash-icon.png assets/favicon.png assets/notification-icon.png
          test "$(identify -format '%wx%h' assets/icon.png)" = "1024x1024"
          test "$(identify -format '%wx%h' assets/adaptive-icon.png)" = "1024x1024"
          test "$(identify -format '%wx%h' assets/splash-icon.png)" = "1024x1024"

      - name: Apply RC product and architecture hardening
        run: |
          python -m py_compile scripts/rc1_apply.py scripts/rc1_runner.py scripts/rc1_postfix.py
          python scripts/rc1_runner.py
          python scripts/rc1_postfix.py

      - name: Update locked dependency metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify TypeScript, domain rules and RC invariants
        run: npm run verify:rc

      - name: Build web application
        env:
          EXPO_PUBLIC_MOCK_MODE: "true"
          EXPO_PUBLIC_GITHUB_PAGES: "false"
        run: npm run web:build

      - name: Validate public Expo configuration
        env:
          EAS_BUILD_PROFILE: release-candidate
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.invalid/v1/realtime
          EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://business.example.invalid
          EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-0000-0000-000000000000
          EXPO_PUBLIC_PRIVACY_POLICY_URL: https://legal.example.invalid/privacy
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: https://legal.example.invalid/delete-account
          EXPO_PUBLIC_MOCK_MODE: "false"
        run: npx expo config --type public >/tmp/expo-public-config.json

      - name: Generate and inspect native projects
        env:
          EAS_BUILD_PROFILE: release-candidate
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
          EXPO_PUBLIC_REALTIME_URL: wss://api.example.invalid/v1/realtime
          EXPO_PUBLIC_BUSINESS_WEB_BASE_URL: https://business.example.invalid
          EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-0000-0000-000000000000
          EXPO_PUBLIC_PRIVACY_POLICY_URL: https://legal.example.invalid/privacy
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: https://legal.example.invalid/delete-account
          EXPO_PUBLIC_MOCK_MODE: "false"
        run: |
          npx expo prebuild --clean --no-install
          find ios -name PrivacyInfo.xcprivacy -print -quit | grep .
          test -f android/app/src/main/AndroidManifest.xml
          find android/app/src/main/res -type f | grep -E 'connexio[_-]notification' | head -1
          grep -R "com.neptunebusiness.connexio" android/app/build.gradle ios >/dev/null

      - name: Remove staging and obsolete temporary files
        run: |
          git rm -f --ignore-unmatch .github/workflows/v14-governance-pass.yml
          git rm -f --ignore-unmatch .github/workflows/rc1-hardening.yml
          git rm -f --ignore-unmatch .github/workflows/rc1-audio-diagnostic.yml
          git rm -f --ignore-unmatch .github/workflows/rc1-wire-runner.yml
          git rm -f --ignore-unmatch scripts/rc1_apply.py scripts/rc1_runner.py scripts/rc1_postfix.py
          git rm -f --ignore-unmatch scripts/.rc1_*.b64
          git rm -f --ignore-unmatch scripts/.tmp_* scripts/.tmp* scripts/.native_* scripts/.native* || true
          rm -rf ios android dist .test-dist

      - name: Commit validated RC1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement final à enregistrer"
            exit 1
          fi
          git commit -m "release: prepare Connexio 1.0.0 RC1 for store validation"
          git push origin HEAD:release/connexio-rc1
