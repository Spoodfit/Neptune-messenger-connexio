name: Fix visible overlap audit

on:
  push:
    branches:
      - feat/production-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Measure only the visible portion of controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/visual-audit.cjs")
          content = path.read_text(encoding="utf-8")
          old = '''    const controlRects = controls.map((element) => ({
              element,
              label: label(element),
              rect: element.getBoundingClientRect()
            }));'''
          new = '''    const clippedVisibleRect = (element) => {
              const raw = element.getBoundingClientRect();
              let left = Math.max(0, raw.left);
              let right = Math.min(viewportWidth, raw.right);
              let top = Math.max(0, raw.top);
              let bottom = Math.min(viewportHeight, raw.bottom);
              let ancestor = element.parentElement;
              const clips = (value) => ["hidden", "clip", "auto", "scroll"].includes(value);

              while (ancestor && ancestor !== document.body) {
                const style = getComputedStyle(ancestor);
                const ancestorRect = ancestor.getBoundingClientRect();
                if (clips(style.overflowX)) {
                  left = Math.max(left, ancestorRect.left);
                  right = Math.min(right, ancestorRect.right);
                }
                if (clips(style.overflowY)) {
                  top = Math.max(top, ancestorRect.top);
                  bottom = Math.min(bottom, ancestorRect.bottom);
                }
                ancestor = ancestor.parentElement;
              }

              return {
                left,
                right,
                top,
                bottom,
                width: Math.max(0, right - left),
                height: Math.max(0, bottom - top)
              };
            };

            const controlRects = controls.map((element) => ({
              element,
              label: label(element),
              rect: clippedVisibleRect(element)
            }));'''

          if new not in content:
              if content.count(old) != 1:
                  raise SystemExit("Le bloc controlRects attendu est absent ou ambigu.")
              path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit the audit correction and remove this temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-visible-overlap-audit.yml
          git config user.name "Connexio CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/visual-audit.cjs
          git commit -m "test(responsive): mesurer les zones tactiles réellement visibles"
          git push origin HEAD:feat/production-hardening
