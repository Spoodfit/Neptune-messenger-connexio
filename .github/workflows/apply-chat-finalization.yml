name: Apply Chat Finalization

on:
  push:
    branches:
      - feat/production-hardening

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[chat-finalization]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-hardening
          fetch-depth: 0
      - name: Apply strict chat patch
        run: python scripts/apply_chat_finalization.py
      - name: Remove one-off patch machinery
        run: rm scripts/apply_chat_finalization.py .github/workflows/apply-chat-finalization.yml
      - name: Commit finalized chat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/chat/[id].tsx scripts/apply_chat_finalization.py .github/workflows/apply-chat-finalization.yml
          git commit -m "feat: finaliser les médias, mentions et appels du chat"
          git push origin HEAD:feat/production-hardening
